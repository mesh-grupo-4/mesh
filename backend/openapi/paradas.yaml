openapi: 3.0.3
info:
  title: Mesh API — Paradas y solicitudes de parada
  version: 1.0.0
  description: |
    Paradas voluntarias durante el viaje en curso y solicitudes de parada al líder.

    - Una parada abierta (`fin: null`) hace que el integrante figure como
      `detenido_voluntario` en el mapa grupal (RN-037). El estado se **deriva** de
      la parada: no se guarda duplicado en `ubicacion_viva`.
    - Al iniciar una parada se notifica a todos los integrantes del viaje.
    - Solo hay una parada abierta y una solicitud pendiente por integrante y viaje.
    - Solo el líder aprueba o rechaza solicitudes (RN-030, RN-044).
    - Todas las operaciones requieren el viaje en estado `en_curso`.

    Autenticación: `Authorization: Bearer <Firebase ID token>`.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Paradas
  - name: SolicitudesParada

paths:
  /api/viajes/{viajeId}/paradas:
    post:
      summary: Registrar una parada voluntaria (US1)
      description: |
        Registra hora y ubicación de la parada, emite `viaje:parada_iniciada` a la
        room del viaje y manda push a todos los integrantes salvo el autor.
      operationId: iniciarParada
      tags: [Paradas]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarParadaBody'
      responses:
        '201':
          description: Parada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parada'
        '403':
          description: No participa del viaje (FORBIDDEN)
        '404':
          description: Viaje inexistente (VIAJE_NOT_FOUND)
        '409':
          description: Viaje fuera de curso (INVALID_STATE) o ya hay una parada abierta (PARADA_ABIERTA)

  /api/viajes/{viajeId}/paradas/finalizar:
    post:
      summary: Retomar el viaje y cerrar la parada abierta (US3)
      description: |
        Cierra la parada, calcula `duracion_segundos` y emite `viaje:parada_finalizada`
        con el paso a `en_movimiento`.
      operationId: finalizarParada
      tags: [Paradas]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Parada cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parada'
        '403':
          description: No participa del viaje (FORBIDDEN)
        '409':
          description: No hay parada abierta (SIN_PARADA_ABIERTA)

  /api/viajes/{viajeId}/paradas/activa:
    get:
      summary: Parada abierta del usuario autenticado
      description: Rehidrata la pantalla en vivo al volver a entrar. `null` si está en movimiento.
      operationId: obtenerParadaActiva
      tags: [Paradas]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Parada abierta o null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Parada'
                  - type: 'null'

  /api/viajes/{viajeId}/solicitudes-parada:
    get:
      summary: Listar solicitudes de parada
      description: |
        El líder recibe las **pendientes** del viaje; un participante, **solo las suyas**,
        para conocer el estado de la que envió.
      operationId: listarSolicitudesParada
      tags: [SolicitudesParada]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Solicitudes visibles para quien consulta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudParada'
    post:
      summary: Solicitar una parada al líder (US2)
      description: Emite `viaje:solicitud_parada` y manda push al líder.
      operationId: solicitarParada
      tags: [SolicitudesParada]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarParadaBody'
      responses:
        '201':
          description: Solicitud creada en estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudParada'
        '409':
          description: El líder no se solicita paradas (ES_LIDER) o ya hay una pendiente (SOLICITUD_PENDIENTE)

  /api/viajes/{viajeId}/solicitudes-parada/{solicitudId}/responder:
    post:
      summary: Aprobar o rechazar una solicitud (US2, solo líder)
      description: |
        RN-030: solo el creador del viaje puede resolver. Emite
        `viaje:solicitud_parada_resuelta` y avisa por push al solicitante.
      operationId: responderSolicitudParada
      tags: [SolicitudesParada]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [aprobada, rechazada]
      responses:
        '200':
          description: Solicitud resuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudParada'
        '403':
          description: No es el líder (FORBIDDEN)
        '404':
          description: La solicitud no existe o es de otro viaje (SOLICITUD_NOT_FOUND)
        '409':
          description: Ya estaba resuelta (SOLICITUD_RESUELTA)

  /api/viajes/{viajeId}/solicitudes-parada/{solicitudId}/cancelar:
    post:
      summary: Retirar la propia solicitud pendiente
      operationId: cancelarSolicitudParada
      tags: [SolicitudesParada]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Solicitud cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudParada'
        '403':
          description: La solicitud es de otro integrante (FORBIDDEN)
        '409':
          description: Ya estaba resuelta (SOLICITUD_RESUELTA)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

  parameters:
    ViajeId:
      name: viajeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CategoriaParada:
      type: string
      enum: [kiosco, combustible, descanso, gastronomia, punto_control, sanitario, otro]

    EstadoIntegrante:
      type: string
      description: RN-037. Lo derivan las respuestas de ubicaciones vivas y los eventos de socket.
      enum: [en_movimiento, detenido_voluntario, posible_incidente]

    IniciarParadaBody:
      type: object
      required: [lat, lng, categoria]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        categoria:
          $ref: '#/components/schemas/CategoriaParada'

    SolicitarParadaBody:
      type: object
      properties:
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        motivo:
          type: string
          maxLength: 280
          nullable: true

    Parada:
      type: object
      required: [id, viaje_id, usuario_id, lat, lng, inicio]
      properties:
        id:
          type: string
          format: uuid
        viaje_id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        lat:
          type: number
        lng:
          type: number
        categoria:
          allOf:
            - $ref: '#/components/schemas/CategoriaParada'
          nullable: true
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        duracion_segundos:
          type: integer
          nullable: true
          description: Null mientras la parada sigue abierta.

    SolicitudParada:
      type: object
      required: [id, viaje_id, solicitante_id, estado, created_at]
      properties:
        id:
          type: string
          format: uuid
        viaje_id:
          type: string
          format: uuid
        solicitante_id:
          type: string
          format: uuid
        solicitante_nombre:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        motivo:
          type: string
          nullable: true
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada, cancelada]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
