openapi: 3.0.3

info:
  title: Mesh API
  version: 1.0.0
  description: |
    **Mesh** coordina grupos en movimiento —motociclismo, ciclismo, running y trekking—
    combinando una API REST para el ciclo de vida de viajes, grupos y rutas, con un canal
    Socket.io para el seguimiento en vivo.

    Proyecto de tesis · UTN FRC · Grupo 4 · Curso 5K1 · 2026.

    ## Autenticación

    Todos los endpoints requieren `Authorization: Bearer <Firebase ID token>`, salvo
    `GET /api/health` y las herramientas bajo `/api/docs`. El backend verifica el token
    contra Firebase y resuelve el `Usuario` local; ese UUID es el que identifica a la
    persona en todo el dominio.

    **Para probar desde acá**: ejecutá `POST /api/docs/login` con tu email y contraseña
    y listo — la página aplica el token sola en el candado *Authorize* y lo reusa en
    todas las operaciones que pruebes después, incluso si recargás. No hace falta
    copiar ni pegar nada. Para cerrar sesión, *Authorize* → *Logout*.

    ## Autorización

    RN-030: **el backend valida cada acción**. El frontend solo orienta visualmente y
    nunca es la fuente de verdad sobre permisos. Las mutaciones sensibles —iniciar y
    finalizar viaje, configurar la ruta, gestionar integrantes— comprueban el rol de
    líder o la condición de creador antes de ejecutarse.

    RN-011: dentro de un grupo existen exactamente dos roles, `lider` y `participante`.

    RN-120: aparte de los roles de grupo existe un rol de **plataforma**, `superadmin`,
    que habilita el backoffice `/api/admin` (gestión de usuarios, grupos y viajes, con
    auditoría de cada acción). No es un rol de grupo ni le da acceso a ubicaciones.

    RN-123: una cuenta suspendida recibe `403 ACCOUNT_SUSPENDED` en cualquier endpoint
    autenticado, aunque su token de Firebase todavía sea válido.

    ## Errores

    Toda respuesta de error tiene la misma forma: `{ error, code }`, donde `error` es
    texto en español apto para mostrar al usuario y `code` es un identificador estable
    para que el cliente ramifique lógica. Los errores de validación Zod agregan
    `details` con el resultado de `flatten()`.

    ## Fecha y hora

    RN-105/106: las fechas se transportan **siempre en UTC**, en ISO 8601. La conversión
    a hora de Argentina (UTC-3, sin horario de verano) ocurre únicamente en el frontend,
    vía `frontend/lib/tiempoArg.ts`.

    ## Coordenadas

    Las geometrías siguen GeoJSON (RFC 7946): el orden de cada par es `[lng, lat]`,
    al revés de la convención habitual. Los cálculos espaciales se delegan a PostGIS.

    ## Tiempo real

    Los eventos de Socket.io no forman parte de este documento —OpenAPI no cubre
    WebSockets—. Están especificados en `backend/docs/websockets.md`.

  contact:
    name: Mesh — Grupo 4, UTN FRC
    url: https://github.com/mesh-grupo-4/mesh

servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: '{protocolo}://{host}'
    description: Despliegue configurable (VPS de test o producción)
    variables:
      protocolo:
        default: https
        enum: [http, https]
      host:
        default: api.mesh-app.com.ar

security:
  - BearerAuth: []

tags:
  - name: Sistema
    description: Estado del servicio.
  - name: Usuarios
    description: |
      Perfil propio, sincronización con Firebase, token de notificaciones push,
      y el perfil público de cualquier usuario de la comunidad (RN-074).
  - name: Privacidad
    description: |
      Permisos de geolocalización y privacidad (RN-110 a RN-114): consentimiento
      informado, interruptor de compartir ubicación por viaje y registro de quién
      accedió a la posición de cada persona.
  - name: Amistades
    description: Búsqueda de personas, solicitudes de amistad y listado de amigos.
  - name: Insignias
    description: |
      Logros otorgados automáticamente al finalizar un viaje cuyas métricas
      cumplen un criterio de distancia, duración y/o tipo de actividad (RN-074,
      E09). Son públicas dentro de la comunidad: cualquier usuario autenticado
      puede ver las insignias de cualquier otro. Nunca hay criterio de
      velocidad (RN-070).
  - name: Rachas
    description: |
      Semanas consecutivas con al menos un viaje finalizado (RN-075, E09). Se
      extiende o reinicia sola al finalizar cada viaje; un job diario notifica
      las que se cortaron por inactividad el mismo día, sin esperar al
      próximo viaje. Públicas dentro de la comunidad, igual que las insignias.
  - name: TablaPosiciones
    description: |
      Ranking global por tipo de actividad y período (RN-076, E09), ordenado
      por distancia o tiempo en movimiento — nunca por velocidad (RN-070).
      La modalidad moto no tiene tabla de posiciones.
  - name: RecorridosPublicados
    description: |
      Red social de recorridos (RN-080 a RN-084, E10): publicar un viaje del historial
      para la comunidad, explorarlos por actividad y zona, importarlos como plantilla,
      valorarlos ("Recomiendo" / "No recomiendo", sin texto) y despublicarlos en
      cualquier momento. Muestra mapa, tipo de actividad, distancia
      y tiempo — nunca velocidad (RN-070).
  - name: Geocoding
    description: Búsqueda de lugares y geocodificación inversa vía Google Places/Geocoding, con Nominatim/OpenStreetMap de respaldo, proxiado por el backend.
  - name: Routing
    description: Cálculo de ruta por calles/senderos vía Google Routes, con OSRM/Valhalla de respaldo, proxiado por el backend.
  - name: Lugares
    description: Sugerencias de lugares por categoría de parada (RN-022) vía Google Places, a lo largo de la ruta o cerca de una posición.
  - name: Grupos
    description: |
      Grupos persistentes, sus integrantes e invitaciones.
      Solo el líder gestiona miembros y elimina el grupo (RN-030).
  - name: Viajes
    description: |
      Ciclo de vida del viaje: creación, invitaciones, configuración de ruta,
      ingreso de posiciones GPS, transiciones de estado y métricas de cierre.
  - name: RutasCompartidas
    description: |
      Links privados de rutas planificadas y plantillas importadas (RN-085–088).
      Distinto del QR para unirse a un viaje (RN-015/016).
  - name: Paradas
    description: |
      Paradas voluntarias durante un viaje en curso (RN-037). El estado
      `detenido_voluntario` de un integrante se deriva de su parada abierta.
  - name: SolicitudesParada
    description: Pedidos de un integrante para que el líder autorice una parada (RN-044).
  - name: Alertas
    description: Alertas que el líder envía al grupo durante el viaje (RN-040/041/043).
  - name: Fantasma
    description: |
      Ghost tracking (RN-073): recorrido histórico para superponer en el mapa en vivo
      y comparar tiempos. Nunca en moto (RN-070) ni en modo recreativo (RN-072).
  - name: Clima
    description: |
      Pronóstico meteorológico sobre la ruta planificada, vía Open-Meteo (RN-108).
      Alerta lluvia y viento fuerte antes de iniciar la actividad.
  - name: Checklist
    description: |
      Checklist de preparativos pre-ruta (RN-026). Es personal: cada integrante tiene
      el suyo dentro del viaje, con ítems sugeridos según la actividad, ítems base que
      define el creador y los que agrega cada uno. Reutilizable entre viajes.
  - name: Gastos
    description: |
      Gastos compartidos del viaje, prorrateados entre quienes elige cada integrante
      al registrarlos. El balance final —quién le debe a quién— se calcula al
      finalizar el viaje.
  - name: Admin
    description: |
      Backoffice de la plataforma (RN-120 a RN-126). Solo rol `superadmin`: gestión de
      cuentas (editar, suspender, eliminar, otorgar rol), grupos y viajes, y la
      auditoría de cada acción. Nunca expone posiciones GPS ni velocidades.
  - name: Reportes
    description: |
      Reportería de negocio del backoffice (RN-127 a RN-131), solo para `superadmin`.
      Todo es agregado: sin datos personales, sin posiciones GPS y sin velocidades
      (RN-070). Los períodos y las series van en hora argentina (RN-105).
  - name: Documentación
    description: |
      Herramientas de esta página, no del contrato que consume la app: el spec crudo y
      el login que autoriza Swagger UI. `DOCS_ENABLED=false` las apaga.

