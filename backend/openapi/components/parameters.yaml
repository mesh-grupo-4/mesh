# Parámetros de path reutilizables.
# Todos son UUID salvo `token`, que es un identificador opaco de ruta compartida.

ViajeId:
  name: viajeId
  in: path
  required: true
  description: UUID del viaje.
  schema:
    type: string
    format: uuid
  example: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d

GrupoId:
  name: grupoId
  in: path
  required: true
  description: UUID del grupo.
  schema:
    type: string
    format: uuid
  example: 7a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d

UsuarioId:
  name: usuarioId
  in: path
  required: true
  description: UUID del usuario (identificador interno, no el `firebase_uid`).
  schema:
    type: string
    format: uuid
  example: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d

SolicitudId:
  name: solicitudId
  in: path
  required: true
  description: UUID de la solicitud de amistad.
  schema:
    type: string
    format: uuid
  example: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e

SolicitudParadaId:
  name: solicitudId
  in: path
  required: true
  description: UUID de la solicitud de parada.
  schema:
    type: string
    format: uuid
  example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d

InvitacionId:
  name: invitacionId
  in: path
  required: true
  description: UUID de la invitación a grupo.
  schema:
    type: string
    format: uuid
  example: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f

ShareToken:
  name: token
  in: path
  required: true
  description: |
    Token opaco del link privado de ruta compartida (RN-085). No es un UUID:
    es una cadena URL-safe de 16 a 64 caracteres.
  schema:
    type: string
    minLength: 16
    maxLength: 64
    pattern: '^[A-Za-z0-9_-]+$'
  example: rQ7xK2mZp9Lw4Ns8Td1Vb6Yg3Hc5Jf0A

PlantillaId:
  name: plantillaId
  in: path
  required: true
  description: UUID de la plantilla de ruta importada.
  schema:
    type: string
    format: uuid
  example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70

BusquedaQuery:
  name: q
  in: query
  required: true
  description: Texto de búsqueda por nombre, apellido o email. Entre 2 y 80 caracteres.
  schema:
    type: string
    minLength: 2
    maxLength: 80
  example: mart

ChecklistItemId:
  name: itemId
  in: path
  required: true
  description: UUID del ítem del checklist de preparativos.
  schema:
    type: string
    format: uuid
  example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f

AlertaId:
  name: alertaId
  in: path
  required: true
  description: UUID de la alerta del viaje.
  schema:
    type: string
    format: uuid
  example: 7e8f90a1-bc2d-4e3f-8a4b-5c6d7e8f90a1

GastoId:
  name: gastoId
  in: path
  required: true
  description: UUID del gasto compartido del viaje.
  schema:
    type: string
    format: uuid
  example: 6d7e8f90-ab1c-4d2e-9f3a-4b5c6d7e8f90

GeocodingQuery:
  name: q
  in: query
  required: true
  description: Texto de búsqueda de lugares (dirección, ciudad, punto de interés). Entre 1 y 200 caracteres.
  schema:
    type: string
    minLength: 1
    maxLength: 200
  example: Plaza San Martín, Córdoba

Lat:
  name: lat
  in: query
  required: true
  description: Latitud del punto a geocodificar de forma inversa.
  schema:
    type: number
    format: double
    minimum: -90
    maximum: 90
  example: -31.4201

Lng:
  name: lng
  in: query
  required: true
  description: Longitud del punto a geocodificar de forma inversa.
  schema:
    type: number
    format: double
    minimum: -180
    maximum: 180
  example: -64.1888

Pagina:
  name: pagina
  in: query
  required: false
  description: Número de página, desde 1.
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1

Limite:
  name: limite
  in: query
  required: false
  description: Cantidad de elementos por página (máximo 100).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20

BusquedaAdmin:
  name: q
  in: query
  required: false
  description: Filtro de texto, sin distinguir mayúsculas. Hasta 80 caracteres.
  schema:
    type: string
    minLength: 1
    maxLength: 80
  example: gomez

ReporteDesde:
  name: desde
  in: query
  required: false
  description: |
    Primer día del período (inclusive), fecha calendario en hora argentina (RN-105).
    Por defecto, 89 días antes de `hasta`.
  schema:
    type: string
    format: date
  example: '2026-07-01'

ReporteHasta:
  name: hasta
  in: query
  required: false
  description: Último día del período (inclusive), hora argentina. Por defecto, hoy. Máximo 2 años de rango.
  schema:
    type: string
    format: date
  example: '2026-10-16'

ReporteGranularidad:
  name: granularidad
  in: query
  required: false
  description: |
    Tamaño de cada balde de las series. Por defecto se elige según el rango:
    `dia` hasta 45 días, `semana` hasta 180, `mes` de ahí en más. Las semanas
    arrancan el lunes.
  schema:
    type: string
    enum: [dia, semana, mes]
  example: mes

ReporteActividad:
  name: actividad
  in: query
  required: false
  description: Restringe el reporte a un tipo de actividad.
  schema:
    $ref: './schemas.yaml#/TipoActividad'

RankingTipoActividad:
  name: tipoActividad
  in: query
  required: true
  description: 'RN-070: la tabla de posiciones global nunca incluye moto (único tipo excluido).'
  schema:
    type: string
    enum: [bici, running, trekking, otro]
  example: bici

RankingPeriodo:
  name: periodo
  in: query
  required: false
  description: Ventana vigente (semana/mes/año calendario en curso, hora argentina). Por defecto `semanal`.
  schema:
    type: string
    enum: [semanal, mensual, anual]
    default: semanal
  example: semanal

RankingOrden:
  name: orden
  in: query
  required: false
  description: Métrica para ordenar. Por defecto `distancia`.
  schema:
    type: string
    enum: [distancia, tiempo]
    default: distancia
  example: distancia
