openapi: 3.0.3
info:
  title: Mesh API — Alertas del viaje
  version: 1.0.0
  description: |
    Alertas que el líder envía al grupo durante el viaje (RN-040, RN-041, RN-043).

    - Solo el creador del viaje puede crearlas, y solo con el viaje `en_curso` (RN-030).
    - Al crearse se emite `viaje:alerta` a la room y se manda push a todos los
      integrantes confirmados, salvo el propio autor (RN-040).
    - `tipo` es el tema que elige el líder; `origen` distingue al líder del motor
      de eventos, que todavía no crea alertas.
    - El historial lo lee cualquier integrante, en cualquier estado del viaje —
      incluido quien salió.

    Autenticación: `Authorization: Bearer <Firebase ID token>`.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Alertas

paths:
  /api/viajes/{viajeId}/alertas:
    get:
      summary: Historial de alertas del viaje
      description: Más reciente primero, hasta 200 entradas.
      operationId: listarAlertas
      tags: [Alertas]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Historial del viaje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerta'
        '403':
          description: No participa del viaje (FORBIDDEN)
        '404':
          description: Viaje inexistente (VIAJE_NOT_FOUND)
    post:
      summary: Crear una alerta para el grupo (US1, solo líder)
      operationId: crearAlerta
      tags: [Alertas]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAlertaBody'
      responses:
        '201':
          description: Alerta creada y notificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'
        '403':
          description: No es el líder del viaje (FORBIDDEN)
        '409':
          description: El viaje no está en curso (INVALID_STATE)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

  parameters:
    ViajeId:
      name: viajeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    TipoAlerta:
      type: string
      description: Tema de la alerta (RN-041).
      enum: [parada, combustible, desvio, peligro, informacion]

    CrearAlertaBody:
      type: object
      required: [tipo, mensaje]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoAlerta'
        mensaje:
          type: string
          minLength: 1
          maxLength: 280
        lat:
          type: number
          description: RN-043; posición de quien la crea, para ubicarla en el mapa.
          nullable: true
        lng:
          type: number
          nullable: true

    Alerta:
      type: object
      required: [id, viaje_id, tipo, origen, mensaje, estado, created_at]
      properties:
        id:
          type: string
          format: uuid
        viaje_id:
          type: string
          format: uuid
        creada_por_id:
          type: string
          format: uuid
          nullable: true
        creada_por_nombre:
          type: string
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoAlerta'
        origen:
          type: string
          enum: [lider, sistema]
        mensaje:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        estado:
          type: string
          description: RN-042; la gestión de estados es de otra US, todas nacen `activa`.
          enum: [activa, pausada, cancelada, resuelta]
        created_at:
          type: string
          format: date-time
