                - - [-31.4201, -64.1888]
                  - [-31.4215, -64.1902]
              checklist:
                - Casco
                - Cámara de repuesto
      '400':
        description: '`recorridoId` no es un UUID (`VALIDATION_ERROR`).'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors: []
                fieldErrors:
                  recorridoId:
                    - recorridoId debe ser un UUID válido
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: No existe o fue despublicado (`RECORRIDO_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Recorrido no encontrado
              code: RECORRIDO_NOT_FOUND
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ImportarRecorridoPublicado:
  post:
    operationId: importarRecorridoPublicado
    summary: Importar un recorrido publicado como plantilla de ruta
    description: |
      RN-084 / SCRUM-62. Copia el recorrido a "Mis rutas" como plantilla, para usarla
      como base de un viaje nuevo (`POST /api/viajes` con `rutaPlantillaId`).

      La plantilla es una copia independiente (RN-086): la traza publicada pasa a ser
      el trazado planificado (los tramos se unen en un solo `LineString`), el primer y
      el último punto son origen y destino, `distancia_planeada_m` es la longitud de
      ese trazado (PostGIS) y `tiempo_estimado_seg` el tiempo en movimiento del autor.
      Sin paradas. Despublicar o borrar el recorrido después no afecta la plantilla.

      Idempotente por `(usuario, recorrido)`: la segunda vez responde `200` con la
      misma plantilla.

      El cuerpo es opcional. Con `guardarChecklist: true` la plantilla se queda con el
      checklist que compartió el autor, y al crear un viaje con esa plantilla los ítems
      entran como personales en el checklist de quien lo crea. Al volver a importar se
      aplica la última elección.
    tags:
      - RecorridosPublicados
    parameters:
      - $ref: '../components/parameters.yaml#/RecorridoPublicadoId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ImportarRecorridoRequest'
          example:
            guardarChecklist: true
    responses:
      '200':
        description: El usuario ya lo había importado; se devuelve la plantilla existente.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ImportacionRuta'
            example:
              plantilla:
                id: 7b1e2d3c-4f5a-4b6c-8d9e-0f1a2b3c4d5e
                nombre: Vuelta al dique
                tipo_actividad: bici
                origen: { lat: -31.4201, lng: -64.1888, nombre: null }
                destino: { lat: -31.4215, lng: -64.1902, nombre: null }
                linestring_geojson:
                  type: LineString
                  coordinates:
                    - [-64.1888, -31.4201]
                    - [-64.1902, -31.4215]
                distancia_planeada_m: 198.4
                tiempo_estimado_seg: 6300
                created_at: '2026-10-30T15:00:00.000Z'
                checklist:
                  - Casco
                  - Cámara de repuesto
                paradas: []
              ya_existia: true
      '201':
        description: Plantilla creada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ImportacionRuta'
            example:
              plantilla:
                id: 7b1e2d3c-4f5a-4b6c-8d9e-0f1a2b3c4d5e
                nombre: Vuelta al dique
                tipo_actividad: bici
                origen: { lat: -31.4201, lng: -64.1888, nombre: null }
                destino: { lat: -31.4215, lng: -64.1902, nombre: null }
                linestring_geojson:
                  type: LineString
                  coordinates:
                    - [-64.1888, -31.4201]
                    - [-64.1902, -31.4215]
                distancia_planeada_m: 198.4
                tiempo_estimado_seg: 6300
                created_at: '2026-10-30T15:00:00.000Z'
                checklist:
                  - Casco
                  - Cámara de repuesto
                paradas: []
              ya_existia: false
      '400':
        description: '`recorridoId` no es un UUID o se envió un campo desconocido (`VALIDATION_ERROR`).'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors: []
                fieldErrors:
                  recorridoId:
                    - recorridoId debe ser un UUID válido
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: No existe o fue despublicado (`RECORRIDO_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Recorrido no encontrado
              code: RECORRIDO_NOT_FOUND
      '422':
        description: La traza guardada no alcanza para armar un trazado (`RECORRIDO_SIN_TRAZA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El recorrido no tiene una traza válida
              code: RECORRIDO_SIN_TRAZA
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ValorarRecorridoPublicado:
  post:
    operationId: valorarRecorridoPublicado
    summary: Valorar un recorrido publicado (Recomiendo / No recomiendo)
    description: |
      RN-082 / SCRUM-63. Solo dos opciones: `recomiendo: true` ("Recomiendo") o
      `recomiendo: false` ("No recomiendo"). Cada usuario valora un recorrido **una
      sola vez**: la valoración no se cambia ni se borra. El autor no puede valorar su
      propio recorrido. Sin comentarios de texto (RN-083): cualquier campo extra es `400`.

      Devuelve el resumen de valoración actualizado (incluye el porcentaje de
      recomendaciones).
    tags:
      - RecorridosPublicados
    parameters:
      - $ref: '../components/parameters.yaml#/RecorridoPublicadoId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [recomiendo]
            additionalProperties: false
            properties:
              recomiendo:
                type: boolean
                description: '`true` = Recomiendo · `false` = No recomiendo.'
          example:
            recomiendo: true
    responses:
      '201':
        description: Valoración registrada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValoracionRecorrido'
            example:
              recomiendan: 10
              no_recomiendan: 3
              total: 13
              porcentaje_recomienda: 77
              muy_recomendado: false
              mi_valoracion: true
      '400':
        description: |
          `recorridoId` no es un UUID, falta `recomiendo`, no es booleano o se envió
          otro campo, como un comentario (`VALIDATION_ERROR`, RN-083).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors:
                  - "Unrecognized key(s) in object: 'comentario'"
                fieldErrors: {}
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Es el autor del recorrido (`VALORACION_PROPIA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No podés valorar tu propio recorrido
              code: VALORACION_PROPIA
      '404':
        description: No existe o fue despublicado (`RECORRIDO_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Recorrido no encontrado
              code: RECORRIDO_NOT_FOUND
      '409':
        description: El usuario ya valoró este recorrido (`VALORACION_EXISTENTE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Ya valoraste este recorrido
              code: VALORACION_EXISTENTE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

SubidaFotoRecorrido:
  post:
    operationId: crearSubidaFotoRecorrido
    summary: Preparar la subida de la foto de un recorrido a publicar
    description: |
      Paso 1 de 3 de la foto opcional de un recorrido publicado (RN-081). Mismas
      condiciones que publicar: el viaje está finalizado y quien pide es el creador o
      un integrante `confirmado`/`salido` (RN-030). Devuelve una URL firmada de Supabase
      Storage para subir un JPEG en la carpeta de quien pide para ese viaje. Los bytes
      van directo del dispositivo a Storage.

      Paso 2: `PUT {upload_url}` con el JPEG (`Content-Type: image/jpeg`, hasta 2 MB).
      Paso 3: `POST /api/viajes/{viajeId}/recorrido/publicar` con `fotoPath` = `path`.
    tags:
      - RecorridosPublicados
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: URL firmada lista para subir.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SubidaFotoRecorrido'
            example:
              path: recorridos/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d/1792000000000.jpg
              upload_url: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/upload/sign/avatares/recorridos/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d/1792000000000.jpg?token=eyJhbGciOi
      '400':
        description: '`viajeId` no es un UUID (`VALIDATION_ERROR`).'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors: []
                fieldErrors:
                  viajeId:
                    - viajeId debe ser un UUID válido
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no participó en el viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        description: Viaje no encontrado (`VIAJE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Viaje no encontrado
              code: VIAJE_NOT_FOUND
      '409':
        description: El viaje todavía no finalizó (`VIAJE_NO_FINALIZADO`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo se pueden publicar viajes finalizados
              code: VIAJE_NO_FINALIZADO
      '502':
        description: Supabase Storage no respondió (`FOTO_SUBIDA_FALLIDA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se pudo preparar la subida de la foto
              code: FOTO_SUBIDA_FALLIDA
      '503':
        description: Storage no está configurado en este entorno (`FOTOS_NO_DISPONIBLES`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Las fotos no están disponibles
              code: FOTOS_NO_DISPONIBLES
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
