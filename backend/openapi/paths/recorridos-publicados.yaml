    parameters:
      - $ref: '../components/parameters.yaml#/RecorridoPublicadoId'
    responses:
      '200':
        description: Recorrido publicado con su traza.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecorridoPublicadoDetalle'
            example:
              id: c4d5e6f7-1a2b-4c3d-8e9f-0a1b2c3d4e5f
              viaje_id: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
              nombre: Vuelta al dique
              tipo_actividad: bici
              distancia_m: 42500
              tiempo_seg: 6300
              publicado_at: '2026-10-23T15:00:00.000Z'
              comentario: Conviene salir temprano, a la tarde se llena de gente.
              foto: null
              tiene_checklist: true
              autor:
                id: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                nombre: Ana
                apellido: Pérez
              valoracion:
                recomiendan: 9
                no_recomiendan: 3
                total: 12
                porcentaje_recomienda: 75
                muy_recomendado: false
                mi_valoracion: true
              mi_plantilla_id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
