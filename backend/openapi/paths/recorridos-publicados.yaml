# Módulo RecorridosPublicados — src/modules/recorridos-publicados/
# Router: top-level (recorridos-publicados.router.ts) · publicar/despublicar cuelgan de /viajes.
#
# Red social de recorridos (RN-081, E10). Un usuario publica un viaje finalizado de su
# historial: se congela un snapshot de SU traza GPS, su distancia y su tiempo en
# movimiento. Los recorridos publicados son visibles para todos los usuarios
# autenticados; despublicar lo oculta para todos en cualquier momento.
#
# RN-070: nunca se expone ni se ordena por velocidad; solo distancia y tiempo.

PublicarRecorrido:
  post:
    operationId: publicarRecorrido
    summary: Publicar un recorrido del historial para la comunidad
    description: |
      Publica el viaje finalizado indicado (creador o integrante `confirmado`/`salido`).
      Congela un snapshot de la traza y las métricas **propias** de quien publica.
      Idempotente: republicar un recorrido ya publicado (o despublicado) refresca el
      snapshot y lo deja activo.

      El cuerpo es opcional. `comentario` es una nota del autor y `compartirChecklist`
      copia al snapshot los textos de **su** checklist de ese viaje. `fotoPath` adjunta
      una foto ya subida con `POST /api/viajes/{viajeId}/recorrido/foto/subida`: el
      backend comprueba que el archivo esté en la carpeta de quien publica y que sea un
      JPEG de hasta 2 MB. Los tres se reemplazan al republicar (sin `fotoPath`, la foto
      anterior se borra). La nota es única y solo la escribe el autor: la comunidad
      sigue sin poder comentar (RN-083).
    tags:
      - RecorridosPublicados
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PublicarRecorridoRequest'
          example:
            comentario: Conviene salir temprano, a la tarde se llena de gente.
            compartirChecklist: true
            fotoPath: recorridos/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d/1792000000000.jpg
    responses:
      '201':
        description: Recorrido publicado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecorridoPublicadoResumen'
            example:
              id: c4d5e6f7-1a2b-4c3d-8e9f-0a1b2c3d4e5f
              viaje_id: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
              nombre: Vuelta al dique
              tipo_actividad: bici
              distancia_m: 42500
              tiempo_seg: 6300
              publicado_at: '2026-10-23T15:00:00.000Z'
              comentario: Conviene salir temprano, a la tarde se llena de gente.
              foto: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/public/avatares/recorridos/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d/1792000000000.jpg
              tiene_checklist: true
              autor:
                id: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                nombre: Ana
                apellido: Pérez
      '400':
        description: |
          `viajeId` no es un UUID, el comentario supera los 280 caracteres o se envió
          un campo desconocido (`VALIDATION_ERROR`). Con `fotoPath`: la ruta no es de la
          carpeta de quien publica para ese viaje (`FOTO_PATH_INVALIDO`), el archivo no
          se subió (`FOTO_NO_SUBIDA`) o no es un JPEG de hasta 2 MB (`FOTO_INVALIDA`, el
          archivo se borra).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../components/schemas.yaml#/ValidationError'
                - $ref: '../components/schemas.yaml#/Error'
            examples:
              validacion:
                summary: Cuerpo inválido
                value:
                  error: Validación fallida
                  code: VALIDATION_ERROR
                  details:
                    formErrors: []
                    fieldErrors:
                      viajeId:
                        - viajeId debe ser un UUID válido
              fotoNoSubida:
                summary: La foto todavía no está en Storage
                value:
                  error: La foto todavía no se subió
                  code: FOTO_NO_SUBIDA
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no participó en el viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        description: Viaje no encontrado (`VIAJE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Viaje no encontrado
              code: VIAJE_NOT_FOUND
      '409':
        description: El viaje todavía no finalizó (`VIAJE_NO_FINALIZADO`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo se pueden publicar viajes finalizados
              code: VIAJE_NO_FINALIZADO
      '422':
        description: El usuario no tiene traza GPS ni métricas en ese viaje (`RECORRIDO_SIN_TRAZA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no tiene un recorrido GPS para publicar
              code: RECORRIDO_SIN_TRAZA
      '502':
        description: Con `fotoPath`, Supabase Storage no respondió al verificar la foto (`FOTO_SUBIDA_FALLIDA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se pudo verificar la foto
              code: FOTO_SUBIDA_FALLIDA
      '503':
        description: Se envió `fotoPath` pero Storage no está configurado en este entorno (`FOTOS_NO_DISPONIBLES`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Las fotos no están disponibles
              code: FOTOS_NO_DISPONIBLES
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
  delete:
    operationId: despublicarRecorrido
    summary: Despublicar un recorrido propio
    description: |
      Oculta el recorrido para toda la comunidad. Se puede hacer en cualquier momento
      y se puede volver a publicar. Solo afecta a recorridos publicados por quien
      consulta.
    tags:
      - RecorridosPublicados
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '204':
        description: Recorrido despublicado. Sin cuerpo.
      '400':
        description: '`viajeId` no es un UUID (`VALIDATION_ERROR`).'
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors: []
                fieldErrors:
                  viajeId:
                    - viajeId debe ser un UUID válido
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: El usuario no tiene ese recorrido publicado (`RECORRIDO_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Recorrido no publicado
              code: RECORRIDO_NOT_FOUND
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

RecorridosPublicadosColeccion:
  get:
    operationId: listarRecorridosPublicados
    summary: Explorar los recorridos publicados por la comunidad
    description: |
      Visibles para cualquier usuario autenticado. No incluye la traza (usar
      `GET /recorridos-publicados/{recorridoId}` para el mapa). Cada recorrido trae su
      valoración de la comunidad (SCRUM-63) y la reputación de quien lo publicó
      (`reputacion_autor`: antigüedad, racha e insignias), que la app usa para
      destacar la tarjeta.

      **Orden (RN-082):** primero los muy recomendados (`valoracion.muy_recomendado`:
      80 % o más de "Recomiendo" con al menos 3 valoraciones) y, dentro de cada grupo,
      el más reciente primero. La paginación respeta ese orden. Nunca depende de la
      reputación del autor ni de la velocidad o el rendimiento (RN-070).

      **Zona geográfica (SCRUM-62):** con `lat` + `lng` (y opcionalmente `radioKm`)
      devuelve solo los recorridos que **arrancan** dentro de ese radio. El cálculo
      lo hace PostGIS (`ST_DWithin` sobre `geography`). `lat` y `lng` van juntos;
      `radioKm` sin centro es `400`.

      **Búsqueda:** `q` busca en el nombre, el comentario y el nombre del autor, sin
      distinguir mayúsculas ni acentos. Se combina con los demás filtros.
    tags:
      - RecorridosPublicados
    parameters:
      - name: tipoActividad
        in: query
        required: false
        description: Filtra por tipo de actividad.
        schema:
          $ref: '../components/schemas.yaml#/TipoActividad'
      - name: q
        in: query
        required: false
        description: Texto a buscar en nombre, comentario y autor. Vacío equivale a no enviarlo.
        schema:
          type: string
          maxLength: 60
        example: dique
      - name: lat
        in: query
        required: false
        description: Latitud del centro de la zona. Requiere `lng`.
        schema:
          type: number
          minimum: -90
          maximum: 90
        example: -31.4201
      - name: lng
        in: query
        required: false
        description: Longitud del centro de la zona. Requiere `lat`.
        schema:
          type: number
          minimum: -180
          maximum: 180
        example: -64.1888
      - name: radioKm
        in: query
        required: false
        description: Radio de la zona en kilómetros. Solo con `lat` y `lng`. Por defecto 25.
        schema:
          type: number
          minimum: 1
          maximum: 200
          default: 25
        example: 25
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: Recorridos publicados.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/RecorridoPublicadoListado'
            example:
              - id: c4d5e6f7-1a2b-4c3d-8e9f-0a1b2c3d4e5f
                viaje_id: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
                nombre: Vuelta al dique
                tipo_actividad: bici
                distancia_m: 42500
                tiempo_seg: 6300
                publicado_at: '2026-10-23T15:00:00.000Z'
                comentario: Conviene salir temprano, a la tarde se llena de gente.
                foto: null
                tiene_checklist: true
                autor:
                  id: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                  nombre: Ana
                  apellido: Pérez
                valoracion:
                  recomiendan: 9
                  no_recomiendan: 3
                  total: 12
                  porcentaje_recomienda: 75
                  muy_recomendado: false
                  mi_valoracion: null
                reputacion_autor:
                  miembro_desde: '2025-08-14T12:00:00.000Z'
                  racha_semanas: 6
                  insignias_total: 5
                  insignias_destacadas:
                    - codigo: centurion_bici
                      nombre: Centurión
                      icono: award
                      rara: true
                    - codigo: cincuenta_k_bici
                      nombre: 50K en bici
                      icono: zap
                      rara: false
                  nivel: leyenda
                mi_plantilla_id: null
      '400':
        description: |
          Parámetros de consulta inválidos (`VALIDATION_ERROR`): fuera de rango, `lat`
          sin `lng` (o al revés) o `radioKm` sin centro.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ValidationError'
            example:
              error: Validación fallida
              code: VALIDATION_ERROR
              details:
                formErrors: []
                fieldErrors:
                  lat:
                    - lat y lng se envían juntos
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

RecorridosPublicadosMios:
  get:
    operationId: listarMisViajesPublicados
    summary: Ids de mis viajes que están publicados
    description: |
      Permite a la app marcar en el historial qué viajes ya están publicados
      ("Despublicar") y cuáles no ("Publicar") sin pedir cada detalle.
    tags:
      - RecorridosPublicados
    responses:
      '200':
        description: Ids de viaje con recorrido activo del usuario.
        content:
          application/json:
            schema:
              type: object
              required: [viaje_ids]
              properties:
                viaje_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
            example:
              viaje_ids:
                - 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

