      y viajes, canales por los que la gente se suma a los viajes (QR, link, grupo, amigo)
      y rutas compartidas e importadas.
    tags:
      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteGranularidad'
