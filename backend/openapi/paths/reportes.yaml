DestinosReporte:
  get:
    operationId: adminReporteDestinos
    summary: Destinos y demanda de servicios en ruta
    description: |
      Top 10 de destinos y orígenes según los nombres de las rutas planificadas, con
      umbral de k-anonimato (RN-130); distribución de distancias planeadas y paradas
      planificadas por categoría (combustible, gastronomía, etc.). No usa posiciones GPS
      (RN-126).
    tags:
      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteActividad'
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteDestinos'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "actividad": null, "umbral_k_anonimato": 3, "top_destinos": [{"lugar": "Los Gigantes", "viajes": 23}, {"lugar": "Cumbrecita", "viajes": 21}, {"lugar": "Mina Clavero", "viajes": 20}], "top_origenes": [{"lugar": "Córdoba", "viajes": 37}, {"lugar": "Río Cuarto", "viajes": 30}, {"lugar": "Villa Carlos Paz", "viajes": 22}], "distancia_planeada": [{"rango": "< 10 km", "cantidad": 2}, {"rango": "10-50 km", "cantidad": 6}, {"rango": "50-100 km", "cantidad": 9}], "paradas_planificadas_por_categoria": [{"categoria": "sanitario", "cantidad": 16}, {"categoria": "gastronomia", "cantidad": 13}, {"categoria": "descanso", "cantidad": 12}]}
