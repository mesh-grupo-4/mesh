# Reportería del backoffice — src/modules/reportes/ (RN-127 a RN-131)
# Router: reportes.router.ts · Service: reportes.service.ts
# Solo superadmin. Solo agregados: sin datos personales, sin posiciones, sin velocidades.

ResumenReporte:
  get:
    operationId: adminReporteResumen
    summary: Resumen ejecutivo con KPIs comparados
    description: |
      KPIs del período contra el período anterior de igual duración: altas, usuarios activos,
      viajes iniciados y finalizados, km y horas de actividad, grupos creados, incidentes
      detectados y tasa de realización de viajes programados. Pensado para la primera
      pantalla de un directorio.
    tags:
      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteGranularidad'
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteResumen'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "periodo_anterior": {"desde": "2025-07-14", "hasta": "2026-02-28", "granularidad": "mes"}, "kpis": {"altas": {"actual": 76, "anterior": 4, "variacion_pct": 1800}, "usuarios_activos": {"actual": 80, "anterior": 0, "variacion_pct": null}, "viajes_iniciados": {"actual": 107, "anterior": 0, "variacion_pct": null}, "viajes_finalizados": {"actual": 105, "anterior": 0, "variacion_pct": null}, "km_recorridos": {"actual": 12266.5, "anterior": 0, "variacion_pct": null}, "horas_actividad": {"actual": 304, "anterior": 0, "variacion_pct": null}, "grupos_creados": {"actual": 12, "anterior": 0, "variacion_pct": null}, "incidentes_detectados": {"actual": 33, "anterior": 0, "variacion_pct": null}}, "tasa_realizacion": {"actual": 0.7926, "anterior": null, "variacion_pp": null}}
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/SuperadminRequerido'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

CrecimientoReporte:
  get:
    operationId: adminReporteCrecimiento
    summary: Crecimiento y activación de usuarios
    description: |
      Serie de altas, usuarios activos y cuentas acumuladas; activación (cuántas cuentas
      nuevas ya participaron en un viaje y en cuántos días, mediana) y distribución por
      actividad preferida.
    tags:
      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteGranularidad'
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteCrecimiento'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "serie": [{"balde": "2026-03-01", "altas": 12, "usuarios_activos": 0, "usuarios_totales": 16}, {"balde": "2026-04-01", "altas": 7, "usuarios_activos": 0, "usuarios_totales": 23}, {"balde": "2026-05-01", "altas": 6, "usuarios_activos": 55, "usuarios_totales": 29}], "activacion": {"altas": 76, "activados": 76, "tasa": 1, "mediana_dias_hasta_primer_viaje": 0}, "actividad_preferida": [{"actividad": "trekking", "cantidad": 16}, {"actividad": "sin_definir", "cantidad": 16}, {"actividad": "bici", "cantidad": 16}]}
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/SuperadminRequerido'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

RetencionReporte:
  get:
    operationId: adminReporteRetencion
    summary: Retención por cohortes mensuales
    description: |
      Matriz de cohortes: por cada mes de alta, qué proporción participó en un viaje en
      los meses siguientes. Las cuentas creadas antes de la migración 20261016120000 tienen
      como fecha de alta la de esa migración, así que las cohortes previas no son
      representativas.
    tags:
      - Reportes
    parameters:
      - name: meses
        in: query
        required: false
        description: Cantidad de cohortes mensuales, contando el mes actual.
        schema: {"type": "integer", "minimum": 2, "maximum": 12, "default": 6}
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteRetencion'
            example: {"meses": 8, "desde": "2026-03", "hasta": "2026-10", "cohortes": [{"cohorte": "2026-03", "tamano": 12, "retencion": [0, 0, 0.75]}, {"cohorte": "2026-04", "tamano": 7, "retencion": [0, 0.8571, 0.7143]}, {"cohorte": "2026-05", "tamano": 6, "retencion": [1, 0.5, 0.6667]}]}
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/SuperadminRequerido'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ViajesReporte:
  get:
    operationId: adminReporteViajes
    summary: Uso del producto (viajes)
    description: |
      Serie de viajes creados, iniciados y finalizados; distancia, duración y personas
      promedio por actividad; modos; grupales vs. individuales; tamaño de los grupos;
      embudo de realización y mapa de calor de horarios de inicio (hora argentina).
      **Sin velocidades** (RN-070).
    tags:
      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteGranularidad'
      - $ref: '../components/parameters.yaml#/ReporteActividad'
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteViajes'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "actividad": null, "serie": [{"balde": "2026-03-01", "creados": 2, "iniciados": 0, "finalizados": 0}, {"balde": "2026-04-01", "creados": 20, "iniciados": 0, "finalizados": 0}, {"balde": "2026-05-01", "creados": 14, "iniciados": 19, "finalizados": 19}], "por_actividad": [{"actividad": "trekking", "viajes": 24, "km_total": 2756.6, "km_promedio": 119.9, "duracion_promedio_min": 163, "personas_promedio": 6.5}, {"actividad": "bici", "viajes": 23, "km_total": 2655.6, "km_promedio": 115.5, "duracion_promedio_min": 215, "personas_promedio": 5}, {"actividad": "running", "viajes": 22, "km_total": 2251.4, "km_promedio": 107.2, "duracion_promedio_min": 178, "personas_promedio": 6.2}], "por_modo": [{"modo": "recreativo", "cantidad": 63}, {"modo": "entrenamiento", "cantidad": 31}, {"modo": "competitivo", "cantidad": 13}], "grupales_vs_individuales": {"grupales": 71, "individuales": 36}, "tamano_grupo": [{"rango": "1", "cantidad": 0}, {"rango": "2-5", "cantidad": 23}, {"rango": "6-10", "cantidad": 31}], "embudo": {"programados": 135, "iniciados": 107, "finalizados": 105, "no_realizados": 28, "tasa_realizacion": 0.7926}, "horarios": [{"dia_semana": 1, "hora": 0, "cantidad": 1}, {"dia_semana": 1, "hora": 4, "cantidad": 1}, {"dia_semana": 1, "hora": 5, "cantidad": 1}]}
      '400':
