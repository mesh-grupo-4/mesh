      - Reportes
    parameters:
      - $ref: '../components/parameters.yaml#/ReporteDesde'
      - $ref: '../components/parameters.yaml#/ReporteHasta'
      - $ref: '../components/parameters.yaml#/ReporteActividad'
    responses:
      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteSeguridad'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "actividad": null, "alertas": {"total": 160, "cada_100_viajes": 149.5, "por_tipo_y_origen": [{"tipo": "informacion", "origen": "lider", "cantidad": 13}, {"tipo": "parada", "origen": "integrante", "cantidad": 12}, {"tipo": "informacion", "origen": "integrante", "cantidad": 12}], "por_estado": [{"estado": "resuelta", "cantidad": 160}]}, "incidentes": {"detectados": 33, "falsas_alarmas": 13, "pidieron_ayuda": 10, "sin_respuesta": 10, "tasa_falsas_alarmas": 0.3939, "cada_100_viajes": 30.8, "por_actividad": [{"actividad": "bici", "detectados": 12, "falsas_alarmas": 6, "pidieron_ayuda": 5, "sin_respuesta": 1, "tasa_falsas_alarmas": 0.5}, {"actividad": "running", "detectados": 7, "falsas_alarmas": 1, "pidieron_ayuda": 2, "sin_respuesta": 4, "tasa_falsas_alarmas": 0.1429}, {"actividad": "trekking", "detectados": 6, "falsas_alarmas": 2, "pidieron_ayuda": 1, "sin_respuesta": 3, "tasa_falsas_alarmas": 0.3333}]}, "solicitudes_parada": {"total": 37, "aprobadas": 20, "rechazadas": 4, "canceladas": 7, "pendientes": 6, "mediana_respuesta_seg": 103, "tasa_aprobacion": 0.8333}, "paradas_voluntarias": [{"categoria": "descanso", "cantidad": 27, "duracion_promedio_min": 22.6}, {"categoria": "gastronomia", "cantidad": 26, "duracion_promedio_min": 18.4}, {"categoria": "combustible", "cantidad": 24, "duracion_promedio_min": 15.7}]}
