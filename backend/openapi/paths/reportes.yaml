      '200':
        description: Reporte.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ReporteComunidad'
            example: {"periodo": {"desde": "2026-03-01", "hasta": "2026-10-16", "granularidad": "mes"}, "serie": [{"balde": "2026-03-01", "grupos_creados": 0, "amistades_nuevas": 0, "rutas_compartidas": 0, "rutas_importadas": 0}, {"balde": "2026-04-01", "grupos_creados": 3, "amistades_nuevas": 0, "rutas_compartidas": 0, "rutas_importadas": 0}, {"balde": "2026-05-01", "grupos_creados": 0, "amistades_nuevas": 10, "rutas_compartidas": 0, "rutas_importadas": 0}], "grupos": {"totales": 12, "activos_en_periodo": 1, "tasa_actividad": 0.0833, "tamano_promedio": 8.3, "distribucion_tamano": [{"rango": "1", "cantidad": 0}, {"rango": "2-5", "cantidad": 4}, {"rango": "6-10", "cantidad": 4}]}, "amistades": {"aceptadas_totales": 89, "amigos_promedio_por_usuario": 2.2, "solicitudes_periodo": {"por_estado": [{"estado": "pendiente", "cantidad": 45}, {"estado": "aceptada", "cantidad": 89}, {"estado": "rechazada", "cantidad": 33}], "aceptadas": 89, "rechazadas": 33, "pendientes": 45, "tasa_aceptacion": 0.7295}}, "invitaciones_grupo": {"por_estado": [{"estado": "aceptada", "cantidad": 13}, {"estado": "pendiente", "cantidad": 21}, {"estado": "rechazada", "cantidad": 14}], "aceptadas": 13, "rechazadas": 14, "pendientes": 21, "tasa_aceptacion": 0.4815}, "invitaciones_viaje": {"por_estado": [{"estado": "salido", "cantidad": 70}, {"estado": "pendiente", "cantidad": 88}, {"estado": "rechazado", "cantidad": 72}], "aceptadas": 319, "rechazadas": 72, "pendientes": 88, "tasa_aceptacion": 0.8159}, "canales_incorporacion": [{"canal": "amigo", "cantidad": 255}, {"canal": "grupo", "cantidad": 224}, {"canal": "link", "cantidad": 220}]}
