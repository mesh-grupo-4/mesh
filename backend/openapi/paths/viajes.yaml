# Módulo Viajes — src/modules/viajes/
# Router: viajes.router.ts · Controller: viajes.controller.ts
#
# Ciclo de vida: planificado → en_curso → finalizado. Solo el creador transiciona (RN-030).
#
# Niveles de acceso, implementados en el service:
#   · assertPuedeVerViaje   → creador o integrante no rechazado (histórico, resumen, ruta)
#   · assertPuedeVerEnVivo  → creador o integrante CONFIRMADO (ubicaciones vivas, sockets)
#   · assertPuedeEnviarGps  → los anteriores, y además el viaje debe estar en curso
#
# RN-070 (irrevocable): las modalidades `moto` y `auto` quedan excluidas de rankings y de la
# gamificación de velocidad. Se refleja en `ranking_habilitado` y en las velocidades
# nulas de las respuestas de métricas.

ViajesColeccion:
  post:
    operationId: crearViaje
    summary: Crear un viaje
    description: |
      Crea el viaje en estado `planificado` y da de alta al creador como integrante
      `confirmado` con origen `creador`.

      - **RN-021:** la actividad determina `velocidad_esperada` y
        `distancia_max_separacion`; las asigna el backend, no el cliente.
      - **RN-107:** `fechaProgramada` debe ser estrictamente futura. Excepción:
        con `inmediato: true` ("Viaje YA") no se envía fecha y el backend usa la hora
        actual. El viaje igual nace `planificado`, así el QR sigue vigente (RN-015)
        hasta que el líder lo inicia.
      - **RN-028/029:** los integrantes de `grupoIds` y las personas de `amigoIds`
        quedan invitados en estado `pendiente`. Quien llega por ambas vías se registra
        una sola vez, con origen `grupo`.
      - Si se envía `rutaPlantillaId`, la ruta se precarga desde esa plantilla propia
        y la actividad pasa a ser la de la plantilla.
      - **RN-065 / RN-070:** `modo: entrenamiento` no existe en moto ni auto
        (`400 MODO_INVALIDO`), igual que `competitivo`.
      - **RN-066:** con `repetir` el viaje repite una sesión de entrenamiento propia:
        nace en `entrenamiento`, con la actividad y el recorrido (planificado o real)
        de esa sesión, guarda `repite_viaje_id` y queda en el mismo circuito de quien
        lo crea. Un entrenamiento que sale de `rutaPlantillaId` se agrupa con los
        demás de esa plantilla.
    tags:
      - Viajes
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CrearViajeRequest'
          examples:
            programado:
              summary: Viaje planificado con fecha
              value:
                nombre: Ruta de las Altas Cumbres
                esGrupal: true
                tipoActividad: bici
                fechaProgramada: '2026-09-01T13:00:00.000Z'
                grupoIds:
                  - 7a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                amigoIds: []
            inmediato:
              summary: Viaje YA (sale ahora)
              value:
                nombre: Viaje rápido · Bicicleta · 14:30
                esGrupal: true
                tipoActividad: bici
                inmediato: true
            repetirSesion:
              summary: Repetir una sesión de entrenamiento (RN-066)
              value:
                nombre: Vuelta al lago
                esGrupal: false
                tipoActividad: running
                inmediato: true
                repetir:
                  viajeId: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
                  recorrido: real
    responses:
      '201':
        description: Viaje creado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeCreado'
      '400':
        description: |
          Validación fallida (por ejemplo, falta `fechaProgramada` sin `inmediato`, o
          viene junto con `inmediato: true`, o `repetir` junto con `rutaPlantillaId`),
          fecha programada en el pasado (`FECHA_PASADA`, RN-107) o modo no permitido
          (`MODO_INVALIDO`): `competitivo` sin grupo, o `competitivo` / `entrenamiento`
          en moto o auto (RN-070).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: La fecha programada debe ser futura
              code: FECHA_PASADA
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          Se indicó un grupo del que el creador no es integrante (`NOT_GROUP_MEMBER`)
          o una persona que no es su amiga (`NOT_FRIEND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              noEsMiembro:
                value:
                  error: Solo podés invitar grupos de los que sos miembro
                  code: NOT_GROUP_MEMBER
              noEsAmigo:
                value:
                  error: Solo podés invitar a tus amigos
                  code: NOT_FRIEND
      '404':
        description: |
          El usuario no existe (`USER_NOT_FOUND`), la plantilla no es suya
          (`PLANTILLA_NOT_FOUND`) o el viaje de `repetir` no es una sesión propia
          (`SESION_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Plantilla no encontrada
              code: PLANTILLA_NOT_FOUND
      '409':
        description: |
          Con `repetir`: la sesión no es un entrenamiento finalizado
          (`SESION_NO_REPETIBLE`) o no tiene el recorrido pedido (`SIN_RECORRIDO`):
          sin ruta planificada para `planificado`, o sin traza GPS propia para `real`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              noRepetible:
                value:
                  error: Solo se repiten sesiones de entrenamiento finalizadas
                  code: SESION_NO_REPETIBLE
              sinRecorrido:
                value:
                  error: Esa sesión no tenía un recorrido planificado
                  code: SIN_RECORRIDO
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ViajesPlanificados:
  get:
    operationId: listarPlanificados
    summary: Listar los viajes planificados y en curso
    description: |
      Viajes en estado `planificado` o `en_curso` donde el usuario es creador o figura
      como integrante `pendiente` o `confirmado`, ordenados por fecha de salida ascendente.

      `mi_estado` resume la situación propia: `creador` para quien lo creó, o el estado
      de su invitación.
    tags:
      - Viajes
    responses:
      '200':
        description: Viajes próximos del usuario.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/ViajeResumenPlanificado'
            example:
              # 2026-09-06T12:30:00Z = sábado 06/09 09:30 en Argentina (UTC-3, RN-105).
              - id: d7e2b915-3f48-4a6c-81d9-5b0e7c2a4f16
                creador_id: 8f14e45f-ceea-4c1e-9b1a-3d5c7a2e6b04
                nombre: Alta Gracia y vuelta
                es_grupal: true
                tipo_actividad: moto
                modo: recreativo
                velocidad_esperada: 85
                distancia_max_separacion: 500
                fecha_programada: '2026-09-06T12:30:00.000Z'
                estado: planificado
                mi_estado: creador
              # Ya arrancó: aparece en la misma lista con estado `en_curso`.
              - id: 1b8d4c37-6e29-4f05-a3b7-9c2f8e5d0a41
                creador_id: 2c9a7d61-4e83-4b2f-9a17-6d0e5b8c1f23
                nombre: Subida al Cerro Champaquí
                es_grupal: true
                tipo_actividad: trekking
                modo: recreativo
                velocidad_esperada: 4.5
                distancia_max_separacion: 150
                fecha_programada: '2026-08-24T10:00:00.000Z'
                estado: en_curso
                mi_estado: confirmado
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ViajesFinalizados:
  get:
    operationId: listarFinalizados
    summary: Listar el historial de viajes finalizados
    description: |
      Viajes ya cerrados, del más reciente al más antiguo.

      Incluye deliberadamente a quienes salieron antes del final (`estado: salido`):
      recorrieron parte del trayecto, así que el viaje les cuenta en el historial.

      Cada entrada trae las métricas **propias** del consultante (US2):
      `mi_distancia_m` y `mi_tiempo_movimiento_seg`. Van en `null` si no hubo traza GPS.
    tags:
      - Viajes
    responses:
      '200':
        description: Historial del usuario.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/ViajeResumenFinalizado'
            example:
              - id: 6f3a1e58-2b74-4c09-9d16-8e5b0a3f7c24
                creador_id: 8f14e45f-ceea-4c1e-9b1a-3d5c7a2e6b04
                nombre: Costanera al atardecer
                es_grupal: true
                tipo_actividad: bici
                modo: recreativo
                velocidad_esperada: 24
                distancia_max_separacion: 300
                fecha_programada: '2026-08-16T21:00:00.000Z'
                fecha_fin_real: '2026-08-16T23:12:41.330Z'
                estado: finalizado
                mi_estado: creador
                mi_distancia_m: 31480.6
                mi_tiempo_movimiento_seg: 5327
              # Salió antes del cierre: el tramo recorrido igual cuenta en el historial.
              # Sin traza GPS, las métricas propias van en `null`.
              - id: 0a7c5d92-4f81-4e36-b2a9-7d1e6c3b0f58
                creador_id: 5a1d3e88-9b64-4c07-83f2-1e7a4b6d9c50
                nombre: null
                es_grupal: false
                tipo_actividad: running
                modo: recreativo
                velocidad_esperada: 11
                distancia_max_separacion: 100
                fecha_programada: '2026-08-09T10:30:00.000Z'
                fecha_fin_real: '2026-08-09T11:48:03.907Z'
                estado: finalizado
                mi_estado: salido
                mi_distancia_m: null
                mi_tiempo_movimiento_seg: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ViajeActual:
  get:
    operationId: viajeEnCurso
    summary: Obtener el viaje que el usuario está transitando
    description: |
      Devuelve el viaje `en_curso` del usuario, o `null` si no hay ninguno.

      La ausencia de viaje **no es un error**: responde 200 con cuerpo `null`. Es la
      consulta que la app usa al abrir para decidir si mostrar el modo de seguimiento.
    tags:
      - Viajes
    responses:
      '200':
        description: Viaje en curso, o `null`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeEnCurso'
            examples:
              enCurso:
                summary: El usuario está transitando un viaje
                value:
                  id: 1b8d4c37-6e29-4f05-a3b7-9c2f8e5d0a41
                  nombre: Subida al Cerro Champaquí
                  tipo_actividad: trekking
                  fecha_inicio_real: '2026-08-24T13:05:22.117Z'
                  soy_creador: false
              sinViaje:
                summary: No hay viaje en curso — 200 con cuerpo `null`, no 404
                value: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

EstadisticasUsuario:
  get:
    operationId: estadisticasUsuario
    summary: Obtener las estadísticas acumuladas del usuario
    description: |
      Totales históricos sobre todos los viajes finalizados en los que participó,
      incluidos aquellos que abandonó antes del cierre.
    tags:
      - Viajes
    responses:
      '200':
        description: Acumulado histórico.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/EstadisticasUsuario'
            examples:
              conHistorial:
                summary: Usuario con viajes finalizados
                value:
                  viajes_finalizados: 14
                  distancia_total_m: 482613.4
                  tiempo_total_seg: 96420
                  actividad_favorita: bici
              sinHistorial:
                summary: Cuenta nueva — sin viajes cerrados todavía
                value:
                  viajes_finalizados: 0
                  distancia_total_m: 0
                  tiempo_total_seg: 0
                  actividad_favorita: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

InvitacionesViajePendientes:
  get:
    operationId: listarInvitacionesViajePendientes
    summary: Listar invitaciones a viajes recibidas
    description: |
      Invitaciones sin responder, de la más reciente a la más antigua.

      Solo se listan las de viajes todavía `planificado`: una vez iniciado el viaje,
      la invitación deja de ofrecerse aunque siga pendiente en la base.
    tags:
      - Viajes
    responses:
      '200':
        description: Invitaciones pendientes.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/InvitacionViajePendiente'
            example:
              - viaje_id: 1b8d4c37-6e29-4f05-a3b7-9c2f8e5d0a41
                nombre: Subida al Cerro Champaquí
                tipo_actividad: trekking
                fecha_programada: '2026-08-24T10:00:00.000Z'
                creador:
                  id: 2c9a7d61-4e83-4b2f-9a17-6d0e5b8c1f23
                  nombre: Bruno Ferreyra
                created_at: '2026-08-20T15:33:07.412Z'
              # Viaje sin nombre: la app cae al nombre del destino.
              - viaje_id: 3e9b6a04-7c25-4d18-8f37-0b4a2e9c6d15
                nombre: null
                tipo_actividad: bici
                fecha_programada: '2026-09-13T11:00:00.000Z'
                creador:
                  id: 5a1d3e88-9b64-4c07-83f2-1e7a4b6d9c50
                  nombre: Diego Sosa
                created_at: '2026-08-19T20:07:55.901Z'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

UnirseQr:
  post:
    operationId: unirseQr
    summary: Unirse a un viaje escaneando su QR
    description: |
      **RN-015/016:** el QR es único por viaje y une directamente, sin necesidad de que
      el líder apruebe. **Expira al iniciarse el viaje**: escanearlo después devuelve
      410 `QR_EXPIRED`.

      Es idempotente: si la persona ya figuraba en el viaje, responde 200 con
      `yaEraParticipante: true` sin duplicar nada.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: El usuario quedó incorporado al viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UnionPorQr'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: El viaje no existe (`VIAJE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Viaje no encontrado
              code: VIAJE_NOT_FOUND
      '410':
        description: El viaje ya arrancó o terminó, así que el QR caducó (`QR_EXPIRED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Este QR ya no es válido porque el viaje comenzó
              code: QR_EXPIRED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

UnirseCodigo:
  post:
    operationId: unirseCodigo
    summary: Unirse a un viaje escribiendo su código
    description: |
      **RN-015/016:** alternativa a escanear el QR, con las mismas reglas: une
      directamente, sin aprobación del líder, y **expira al iniciarse el viaje**.
      El código se acepta en minúsculas y con espacios o guion.

      Es idempotente: si la persona ya figuraba en el viaje, responde 200 con
      `yaEraParticipante: true` sin duplicar nada.
    tags:
      - Viajes
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UnirsePorCodigoBody'
          example:
            codigo: ABCD-2345
    responses:
      '200':
        description: El usuario quedó incorporado al viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UnionPorQr'
            example:
              viajeId: 44444444-4444-4444-4444-444444444444
              yaEraParticipante: false
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: Ningún viaje tiene ese código (`VIAJE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No encontramos un viaje con ese código
              code: VIAJE_NOT_FOUND
      '410':
        description: El viaje ya arrancó o terminó, así que el código caducó (`QR_EXPIRED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Este viaje ya ha comenzado. El código QR ha expirado.
              code: QR_EXPIRED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ResponderInvitacionViaje:
  post:
    operationId: responderInvitacionViaje
    summary: Aceptar o rechazar una invitación a un viaje
    description: |
      Aceptar pasa la participación a `confirmado`; rechazar, a `rechazado`.

      Solo se puede responder mientras el viaje siga `planificado`: una vez iniciado,
      la API devuelve 410 `TRIP_NOT_PLANNED`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AccionInvitacion'
    responses:
      '200':
        description: Invitación respondida.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RespuestaInvitacionViaje'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: No hay invitación para este usuario en este viaje (`INVITATION_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Invitación no encontrada
              code: INVITATION_NOT_FOUND
      '409':
        description: La invitación ya fue respondida (`INVITATION_ALREADY_ANSWERED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: La invitación ya fue respondida
              code: INVITATION_ALREADY_ANSWERED
      '410':
        description: El viaje ya no está planificado (`TRIP_NOT_PLANNED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje ya no acepta respuestas
              code: TRIP_NOT_PLANNED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

InvitarAViaje:
  post:
    operationId: invitarAViaje
    summary: Invitar grupos o amigos a un viaje ya creado
    description: |
      Suma invitaciones `pendiente` a un viaje existente. Se usa desde la sala de
      espera del "Viaje YA", donde el viaje ya está creado y el líder va invitando.

      - **RN-030:** solo el creador (líder) puede invitar.
      - **RN-015:** solo mientras el viaje está `planificado`; un viaje individual no
        admite invitaciones.
      - **RN-028/029:** mismas reglas que al crear: el líder debe ser miembro de cada
        grupo y tener amistad aceptada con cada amigo. Quien llega por ambas vías se
        registra una sola vez, con origen `grupo`.
      - Quien ya figura en el viaje (en cualquier estado) no se vuelve a invitar.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/InvitarViajeRequest'
          example:
            grupoIds:
              - 7a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
            amigoIds:
              - 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
    responses:
      '201':
        description: Invitaciones registradas.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/InvitacionesViajeEnviadas'
            example:
              viaje_id: 0b7e2c1a-9f3d-4c8e-a1b2-3c4d5e6f7a8b
              invitaciones_enviadas: 5
      '400':
        description: Body inválido o sin grupos ni amigos (`VALIDATION_ERROR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Indicá al menos un grupo o un amigo para invitar
              code: VALIDATION_ERROR
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          Quien invita no es el líder (`NOT_CREATOR`), no es miembro de un grupo
          indicado (`NOT_GROUP_MEMBER`) o una persona no es su amiga (`NOT_FRIEND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              noEsLider:
                value:
                  error: Solo el líder puede invitar al viaje
                  code: NOT_CREATOR
              noEsMiembro:
                value:
                  error: Solo podés invitar grupos de los que sos miembro
                  code: NOT_GROUP_MEMBER
              noEsAmigo:
                value:
                  error: Solo podés invitar a tus amigos
                  code: NOT_FRIEND
      '404':
        description: El viaje no existe (`VIAJE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Viaje no encontrado
              code: VIAJE_NOT_FOUND
      '409':
        description: |
          El viaje ya no está planificado (`INVALID_STATE`) o es individual (`INDIVIDUAL_TRIP`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              yaArranco:
                value:
                  error: El viaje no está en estado planificado
                  code: INVALID_STATE
              individual:
                value:
                  error: Un viaje individual no admite invitaciones
                  code: INDIVIDUAL_TRIP
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ParticipantesViaje:
  get:
    operationId: listarParticipantes
    summary: Listar los integrantes del viaje
    description: |
      Todos los integrantes con el estado de su invitación, la vía por la que llegaron,
      su rol y si se unieron de verdad una vez que el viaje arrancó. Primero los
      `confirmado`, después `pendiente`, `salido` y `rechazado`; dentro de cada estado,
      por antigüedad.

      `rol` es `lider` para el creador del viaje, o el rol heredado del `grupo_origen`
      cuando la invitación vino de un grupo; `participante` en cualquier otro caso.
      `union_efectiva` indica si hay GPS del integrante posterior al inicio real del
      viaje (`false` para todos mientras el viaje no arrancó).

      Accesible para el creador y para cualquier integrante que no haya rechazado.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Integrantes del viaje.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/ParticipanteViaje'
            example:
              # Creador: siempre lider, sin grupo_origen.
              - usuario:
                  id: 8f14e45f-ceea-4c1e-9b1a-3d5c7a2e6b04
                  nombre: Lucía
                  apellido: Fernández
                  email: lucia.fernandez@example.com
                estado: confirmado
                origen: creador
                created_at: '2026-08-20T14:00:00.000Z'
                rol: lider
                union_efectiva: true
                grupo_origen: null
              # Invitado desde un grupo del que es lider: hereda ese rol.
              - usuario:
                  id: 2c9a7d61-4e83-4b2f-9a17-6d0e5b8c1f23
                  nombre: Marcos
                  apellido: Ibáñez
                  email: marcos.ibanez@example.com
                estado: confirmado
                origen: grupo
                created_at: '2026-08-20T14:05:00.000Z'
                rol: lider
                union_efectiva: false
                grupo_origen:
                  id: 3d5c7a2e-6b04-4f16-81d9-5b0e7c2a4f16
                  nombre: Club Bici Córdoba
              # Se unió sin grupo (QR): participante por defecto.
              - usuario:
                  id: 9c2f8e5d-0a41-4b2f-9a17-6d0e5b8c1f23
                  nombre: Rocío
                  apellido: Paz
                  email: rocio.paz@example.com
                estado: confirmado
                origen: qr
                created_at: '2026-08-24T09:50:00.000Z'
                rol: participante
                union_efectiva: true
                grupo_origen: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ResumenViajeRecurso:
  get:
    operationId: obtenerResumen
    summary: Obtener el resumen de cierre del viaje
    description: |
      Totales del grupo y métricas propias. **Requiere el viaje finalizado**: en
      cualquier otro estado devuelve 409 `TRIP_NOT_FINISHED`.

      El resumen se calcula al finalizar. Si ese cálculo falló —agregar cientos de miles
      de filas GPS puede tardar— o el viaje es anterior a esta funcionalidad, la consulta
      lo recalcula al vuelo de forma transparente.

      Si la persona no se desplazó (solo ruido del GPS, menos de 100 m netos), `mis_metricas`
      llega con distancia, tiempo y velocidades en `null`.

      **RN-070:** `ranking_habilitado` es `false` en modalidades `moto` y `auto`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Resumen del viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ResumenViaje'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje todavía no finalizó (`TRIP_NOT_FINISHED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje todavía no finalizó
              code: TRIP_NOT_FINISHED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

MetricasGrupalesViaje:
  get:
    operationId: metricasGrupales
    summary: Obtener las métricas del grupo y el desglose por integrante
    description: |
      Agregados del viaje más una fila por integrante, incluidos quienes no registraron
      GPS (con los campos en `null`).

      **RN-070 (irrevocable):** `ranking_habilitado` es `true` únicamente si el viaje es
      grupal **y** la actividad no es motorizada (`moto`, `auto`). En ellas no se calculan puestos ni se
      exponen velocidades: los campos correspondientes llegan en `null`. Es una regla
      de seguridad vial, no una preferencia de producto.

      Requiere el viaje finalizado.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Métricas grupales.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MetricasGrupales'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje todavía no finalizó (`TRIP_NOT_FINISHED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje todavía no finalizó
              code: TRIP_NOT_FINISHED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

MisMetricasViaje:
  get:
    operationId: misMetricas
    summary: Obtener las métricas propias del viaje
    description: |
      Métricas individuales detalladas más el perfil de velocidad minuto a minuto,
      pensado para graficarlo.

      **RN-070:** en modalidades `moto` y `auto` las velocidades llegan en `null` y
      `perfil_velocidad` es un array vacío.

      Requiere el viaje finalizado.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Métricas del usuario en ese viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MisMetricas'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje todavía no finalizó (`TRIP_NOT_FINISHED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje todavía no finalizó
              code: TRIP_NOT_FINISHED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

RecorridoViaje:
  get:
    operationId: obtenerRecorrido
    summary: Traza GPS recorrida por el consultante (US2)
    description: |
      Tramos de puntos `[lat, lng]` ordenados en el tiempo, del recorrido realmente
      hecho en el viaje. Cada tramo (`segmentos[i]`) es contiguo en el tiempo y en el
      espacio: un hueco de señal largo o un salto de posición imposible entre pings
      consecutivos empieza un tramo nuevo en vez de conectarse con una línea recta
      que atraviese el mapa. Cada tramo se simplifica por separado con PostGIS
      (`ST_SimplifyPreserveTopology`) antes de responder: un viaje largo tendría
      miles de posiciones.

      Lectura laxa: quien salió del viaje igual puede repasar su propio recorrido,
      y no exige que el viaje esté finalizado. Sin traza GPS responde
      `segmentos: []`, no un error.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Traza del usuario en el viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Recorrido'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

ViajePorId:
  get:
    operationId: detalleViaje
    summary: Obtener el detalle de un viaje
    description: |
      Viaje completo con su creador, la referencia a la ruta y la participación propia.

      `mi_participacion` viene resuelta también para el creador, que no tiene fila
      propia en `viaje_integrante`: se le informa `{ estado: confirmado, origen: creador }`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Detalle del viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeDetalle'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

  patch:
    operationId: actualizarViaje
    summary: Actualizar un viaje
    description: |
      Permite reprogramar la salida o ajustar la detección automática de posible incidente.

      **Solo el creador** puede hacerlo (RN-030). La fecha solo se edita en estado
      `planificado` y debe ser futura (RN-107). La config de alertas de incidente
      solo aplica a viajes grupales, en `planificado` o `en_curso`.

      Emite `viaje:actualizado` a la sala para que el resto refresque el detalle.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ActualizarViajeRequest'
    responses:
      '200':
        description: Viaje reprogramado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeReprogramado'
      '400':
        description: Validación fallida o fecha en el pasado (`FECHA_PASADA`, RN-107).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: La fecha programada debe ser futura
              code: FECHA_PASADA
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el creador puede modificar el viaje (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el creador puede modificar el viaje
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje ya no está planificado (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo se puede editar un viaje planificado
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

  delete:
    operationId: eliminarViaje
    summary: Eliminar un viaje
    description: |
      **Solo el creador** puede eliminarlo (RN-030). Un viaje `en_curso` no se elimina:
      primero hay que finalizarlo.

      El borrado arrastra integrantes, ruta, registros GPS y métricas asociadas.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Viaje eliminado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeEliminado'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el creador puede eliminar el viaje (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el creador puede eliminar el viaje
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se puede eliminar un viaje en curso. Finalizalo primero.
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

PosicionesViaje:
  post:
    operationId: ingresarPosiciones
    summary: Ingresar posiciones GPS
    description: |
      Persiste registros GPS del usuario en el viaje. Es el endpoint que sostiene el
      **offline-first (RN-038)**.

      - `source: live` → envío en tiempo real (RN-031: una lectura cada 5 s).
      - `source: offline_sync` → lote acumulado en el dispositivo sin señal. El backend
        lo procesa en bloque **sin perder registros ni alterar la secuencia temporal**:
        el orden lo fija el `timestamp` de cada lectura, no el momento de llegada.

      Hasta 2000 posiciones por llamada. La última del lote actualiza además la
      ubicación viva del usuario y se emite a la sala del viaje por Socket.io.

      Requiere el viaje **en curso** y ser el líder o un integrante confirmado que
      **ya se sumó** (`check_in_at`, RN-029b). La cola offline del dispositivo manda el
      check-in antes que las posiciones, así el lote no se rechaza.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PosicionesRequest'
          example:
            source: offline_sync
            posiciones:
              - lat: -31.4201
                lng: -64.1888
                precision: 8.4
                altitud: 452.3
                precisionAltitud: 6.5
                velocidadKmh: 21.6
                rumbo: 87.5
                timestamp: '2026-09-01T13:05:00.000Z'
              - lat: -31.4215
                lng: -64.1902
                precision: 6.1
                timestamp: '2026-09-01T13:05:05.000Z'
    responses:
      '201':
        description: Posiciones persistidas.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PosicionesIngresadas'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          El usuario no participa del viaje (`FORBIDDEN`), o confirmó pero todavía no
          se sumó al viaje en curso (`NOT_CHECKED_IN`, RN-029b: ver `POST /check-in`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              sinAcceso:
                value:
                  error: Sin acceso a este viaje
                  code: FORBIDDEN
              sinCheckIn:
                value:
                  error: Tenés que sumarte al viaje antes de compartir tu ubicación
                  code: NOT_CHECKED_IN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje no está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no admite envío de GPS en este estado
              code: INVALID_STATE
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

UbicacionVivaViaje:
  put:
    operationId: upsertUbicacionViva
    summary: Publicar la posición actual
    description: |
      Actualiza la ubicación viva del usuario y persiste un `registro_gps` con
      `source: live`, de modo que la traza del viaje queda completa.

      La nueva posición se emite por Socket.io a la sala `viaje:<id>`, que es como el
      resto del grupo la ve aparecer en el mapa (RN-032: hasta 10 s de latencia).

      Alternativa a `POST /posiciones` para el envío de a una lectura. Requiere el viaje
      en curso.

      RN-111: si el usuario tiene apagado el compartir ubicación en este viaje —o no
      otorgó el consentimiento de geolocalización (RN-110)— el punto se persiste igual
      pero no se publica, y la respuesta trae `compartida: false` con `ubicacion: null`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UbicacionVivaRequest'
    responses:
      '200':
        description: Posición persistida; `compartida` indica si además se publicó al grupo.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/UbicacionVivaRespuesta'
            example:
              compartida: true
              ubicacion:
                usuario_id: 8f14e45f-ceea-4c1e-9b1a-3d5c7a2e6b04
                viaje_id: 3f2a1c4e-5b6d-4e7f-8a9b-0c1d2e3f4a5b
                lat: -31.4201
                lng: -64.1888
                precision_m: 8.4
                updated_at: '2026-09-01T13:05:00.000Z'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          El usuario no participa del viaje (`FORBIDDEN`), o confirmó pero todavía no
          se sumó al viaje en curso (`NOT_CHECKED_IN`, RN-029b: ver `POST /check-in`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              sinAcceso:
                value:
                  error: Sin acceso a este viaje
                  code: FORBIDDEN
              sinCheckIn:
                value:
                  error: Tenés que sumarte al viaje antes de compartir tu ubicación
                  code: NOT_CHECKED_IN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje no está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no admite envío de GPS en este estado
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

UbicacionesVivasViaje:
  get:
    operationId: listarUbicacionesVivas
    summary: Listar las últimas posiciones de los integrantes
    description: |
      Última posición conocida de cada integrante, ordenada por frescura. Es lo que
      alimenta el mapa grupal.

      Acceso **estricto**: solo el creador y los integrantes `confirmado`. Quien salió
      del viaje deja de recibir el GPS del grupo, y por eso este endpoint devuelve 403
      donde otros del mismo viaje devolverían 200.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Posiciones vivas de los integrantes.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/UbicacionViva'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no es integrante confirmado (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

RutaViajeRecurso:
  get:
    operationId: obtenerRuta
    summary: Obtener la ruta planificada del viaje
    description: |
      Ruta con origen, destino, trazado y paradas ordenadas. Accesible para el creador
      y cualquier integrante que no haya rechazado la invitación.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Ruta del viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RutaViaje'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: El usuario no tiene acceso al viaje (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        description: El viaje no existe (`VIAJE_NOT_FOUND`) o todavía no tiene ruta (`ROUTE_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Ruta no configurada
              code: ROUTE_NOT_FOUND
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

  put:
    operationId: guardarRuta
    summary: Guardar o reemplazar la ruta del viaje
    description: |
      **Solo el creador** puede configurar la ruta (RN-030).

      Las paradas se reemplazan por completo en cada llamada. La distancia planeada
      **no se envía**: la calcula PostGIS sobre el `linestring` (`ST_Length` sobre
      geografía), siguiendo la decisión de delegar los cálculos espaciales a la base.

      Los trazados de OSRM pueden rondar los 170 kB; el límite de body es 2 MB y
      superarlo devuelve 413 `PAYLOAD_TOO_LARGE`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/GuardarRutaRequest'
          example:
            origen:
              type: Point
              coordinates: [-64.1888, -31.4201]
            destino:
              type: Point
              coordinates: [-65.0056, -31.7256]
            origenNombre: Córdoba Capital
            destinoNombre: Mina Clavero
            linestring:
              type: LineString
              coordinates:
                - [-64.1888, -31.4201]
                - [-64.5, -31.55]
                - [-65.0056, -31.7256]
            tiempoEstimadoSeg: 9000
            paradas:
              - orden: 0
                lat: -31.55
                lng: -64.5
                nombre: YPF Ruta 20
                categoria: combustible
    responses:
      '200':
        description: Ruta guardada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RutaGuardada'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el creador puede configurar la ruta (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el creador puede configurar la ruta
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '422':
        description: PostGIS no pudo calcular la longitud del trazado (`ROUTE_COMPUTE_FAILED`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se pudo calcular la ruta. Verifica la ubicación de los puntos.
              code: ROUTE_COMPUTE_FAILED
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

IniciarViaje:
  post:
    operationId: iniciarViaje
    summary: Iniciar el viaje
    description: |
      Transición `planificado` → `en_curso`. **Solo el creador** puede hacerla (RN-030).

      No se puede iniciar si la persona lidera otro viaje `en_curso` o ya se sumó a uno
      con check-in (RN-030c). Un confirmado sin check-in no bloquea.

      Efectos: registra `fecha_inicio_real`, **caduca el QR de invitación** (RN-015),
      habilita el ingreso de GPS y emite `viaje:iniciado` a la sala `viaje:<id>`.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Viaje iniciado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Viaje'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el creador puede iniciar el viaje (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el creador puede iniciar el viaje
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: |
          El viaje no está en estado planificado (`INVALID_STATE`) o la persona ya está en
          otro viaje en curso (`OTRO_VIAJE_EN_CURSO`, RN-030c).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../components/schemas.yaml#/Error'
                - $ref: '../components/schemas.yaml#/ErrorOtroViajeEnCurso'
            examples:
              estadoInvalido:
                summary: El viaje ya no está planificado
                value:
                  error: El viaje no está en estado planificado
                  code: INVALID_STATE
              otroViajeEnCurso:
                summary: La persona ya está en otro viaje en curso
                value:
                  error: Ya estás en "Sierras", que sigue en curso. Terminalo o salí de ese viaje antes de iniciar otro.
                  code: OTRO_VIAJE_EN_CURSO
                  viaje_en_curso_id: 1b8d4c37-6e29-4f05-a3b7-9c2f8e5d0a41
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

FinalizarViaje:
  post:
    operationId: finalizarViaje
    summary: Finalizar el viaje
    description: |
      Transición `en_curso` → `finalizado`. **Solo el creador** puede hacerla (RN-030).

      Efectos: registra `fecha_fin_real`, deja de aceptar GPS, emite `viaje:finalizado`
      a la sala y notifica por push a los integrantes confirmados.

      El resumen y las métricas se calculan a continuación. Si ese cálculo falla, el
      viaje **queda cerrado igual** y `GET /resumen` lo recalcula al consultarlo: el
      cierre nunca se bloquea por el agregado de métricas.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Viaje finalizado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Viaje'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el creador puede finalizar el viaje (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el creador puede finalizar el viaje
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje no está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no está en curso
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

SalirViaje:
  post:
    operationId: salirViaje
    summary: Bajarse de un viaje grupal
    description: |
      El estado en que queda la persona depende de cuándo se baja (RN-029c):

      | Viaje | Situación | Queda |
      |---|---|---|
      | `planificado` | confirmado | `rechazado` (nunca fue, no le figura en el historial) |
      | `en_curso` | sin check-in ("No voy a ir") | `ausente` |
      | `en_curso` | con check-in | `salido` (salida blanda: conserva su fila y figura en el resumen) |

      Con el viaje en curso se emite `viaje:participante_salio` (con `estado`) a la sala.
      Si queda `salido` además se cierran su parada abierta, sus alertas del sistema y
      su posición viva. El viaje **no** se cierra para los demás.

      **El líder** también puede bajarse (RN-029d), pero antes tiene que ceder el
      liderazgo enviando `nuevo_lider_id` (igual que en grupos, RN-013). En curso el
      sucesor tiene que haberse sumado. Si no hay a quién cederlo responde
      `LEADER_LAST_MEMBER`: hay que eliminar el viaje (planificado) o finalizarlo (en curso).
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/SalirViajeRequest'
          examples:
            participante:
              summary: Participante (sin body)
              value: {}
            lider:
              summary: Líder que cede antes de bajarse
              value:
                nuevo_lider_id: 44444444-4444-4444-4444-444444444444
    responses:
      '200':
        description: La persona se bajó del viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SalidaDeViaje'
            examples:
              enCurso:
                value:
                  viaje_id: 11111111-1111-1111-1111-111111111111
                  accion: salido
              noVoy:
                value:
                  viaje_id: 11111111-1111-1111-1111-111111111111
                  accion: ausente
              antesDelInicio:
                value:
                  viaje_id: 11111111-1111-1111-1111-111111111111
                  accion: rechazado
      '400':
        description: |
          El líder no eligió sucesor (`LEADER_MUST_TRANSFER`), se eligió a sí mismo
          (`INVALID_LEADER`) o el body es inválido (`VALIDATION_ERROR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              sinSucesor:
                value:
                  error: Elegí a quién cederle el liderazgo antes de salir
                  code: LEADER_MUST_TRANSFER
              aSiMismo:
                value:
                  error: No podés cederte el liderazgo a vos mismo
                  code: INVALID_LEADER
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          El usuario no es integrante confirmado (`NOT_PARTICIPANT`), o es el líder de
          un viaje ya finalizado (`LEADER_CANNOT_LEAVE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              noConfirmado:
                value:
                  error: No sos participante confirmado de este viaje
                  code: NOT_PARTICIPANT
              liderFinalizado:
                value:
                  error: El líder no puede salir de un viaje finalizado
                  code: LEADER_CANNOT_LEAVE
      '404':
        description: |
          El viaje no existe (`VIAJE_NOT_FOUND`) o el sucesor no es integrante
          confirmado (`MEMBER_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El nuevo líder no es integrante confirmado del viaje
              code: MEMBER_NOT_FOUND
      '409':
        description: |
          El viaje es individual (`INDIVIDUAL_TRIP`), no hay a quién ceder el liderazgo
          (`LEADER_LAST_MEMBER`) o el sucesor elegido todavía no se sumó al viaje en
          curso (`NOT_CHECKED_IN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              individual:
                value:
                  error: Un viaje individual no se abandona, se finaliza
                  code: INDIVIDUAL_TRIP
              ultimo:
                value:
                  error: 'No hay otro integrante sumado al viaje: finalizalo en lugar de salir'
                  code: LEADER_LAST_MEMBER
              sucesorSinCheckIn:
                value:
                  error: El nuevo líder todavía no se sumó al viaje
                  code: NOT_CHECKED_IN
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

CheckInViaje:
  post:
    operationId: checkInViaje
    summary: Sumarse al viaje en curso ("Me sumo")
    description: |
      RN-029b: `confirmado` solo significa "dije que voy". La presencia real se marca
      con este check-in. Recién desde acá se acepta el GPS de la persona, la evalúa
      el motor de eventos y recibe las alertas en vivo; sin check-in el envío de GPS
      responde `NOT_CHECKED_IN`.

      Es **idempotente**: si ya se había sumado devuelve el check-in original (puede
      llegar repetido desde la cola offline, que lo manda antes que las posiciones).
      El líder hace check-in implícito al iniciar.

      Emite `viaje:participante_sumado` a la sala.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CheckInRequest'
          example:
            check_in_at: '2026-08-21T14:05:00.000Z'
    responses:
      '200':
        description: La persona quedó sumada al viaje.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CheckInViaje'
            example:
              viaje_id: 11111111-1111-1111-1111-111111111111
              check_in_at: '2026-08-21T14:05:00.000Z'
      '400':
        description: Body inválido (`VALIDATION_ERROR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: check_in_at debe ser una fecha válida
              code: VALIDATION_ERROR
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          No es integrante confirmado del viaje (`NOT_PARTICIPANT`). Incluye a quien
          quedó `ausente`, `salido`, `rechazado` o sigue `pendiente`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No sos participante confirmado de este viaje
              code: NOT_PARTICIPANT
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje no está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no está en curso
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

AvisarFaltantesViaje:
  post:
    operationId: avisarFaltantesViaje
    summary: Avisar por push a los que confirmaron y todavía no están
    description: |
      RN-029e: el **líder** les manda una notificación push a los integrantes que
      dijeron que iban pero todavía no están.

      - Viaje `planificado`: va a todos los `confirmado` ("Estamos por salir").
      - Viaje `en_curso`: va solo a los `confirmado` sin check-in ("Ya arrancamos",
        con la invitación a tocar "Me sumo", RN-029b).

      El texto es fijo (no admite mensaje libre) y no incluye la ubicación de nadie.
      El líder nunca se avisa a sí mismo. Hay una espera de 2 minutos entre avisos
      por viaje; si no hay a quién avisar (`faltantes: 0`) la espera no se consume.

      `avisados` puede ser menor que `faltantes`: cuenta solo a quienes tienen las
      notificaciones push activas en su dispositivo.

      Al iniciar el viaje (`POST /iniciar`) el backend ya manda este mismo aviso de
      forma automática, sin consumir la espera.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Aviso enviado (o no había a quién avisar).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AvisoFaltantes'
            example:
              viaje_id: 11111111-1111-1111-1111-111111111111
              faltantes: 3
              avisados: 2
              espera_seg: 120
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el líder del viaje puede avisar (`NOT_CREATOR`, RN-030).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el líder puede avisar a los que faltan
              code: NOT_CREATOR
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje ya finalizó (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje ya finalizó
              code: INVALID_STATE
      '429':
        description: |
          Ya se mandó un aviso hace menos de 2 minutos (`AVISO_RECIENTE`). El cuerpo
          trae `reintentar_en_seg` con lo que falta para poder avisar de nuevo.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorAvisoReciente'
            example:
              error: Ya les avisaste recién. Podés volver a avisar en 85 s.
              code: AVISO_RECIENTE
              reintentar_en_seg: 85
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

CederLiderazgoViaje:
  post:
    operationId: cederLiderazgoViaje
    summary: Ceder el liderazgo del viaje
    description: |
      RN-029d: el líder le pasa el viaje a otro integrante, antes de iniciarlo (a un
      `confirmado`) o en curso (a alguien que ya se sumó). El líder anterior sigue en
      el viaje como participante. No crea roles nuevos (RN-011): solo cambia quién
      es el líder, y desde ese momento el nuevo líder es quien puede iniciar,
      finalizar, aprobar paradas, etc. (RN-030).

      Emite `viaje:lider_cambiado` a la sala y notifica por push al nuevo líder.
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CederLiderazgoRequest'
          example:
            nuevo_lider_id: 44444444-4444-4444-4444-444444444444
    responses:
      '200':
        description: Liderazgo cedido.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/LiderazgoCedido'
            example:
              viaje_id: 11111111-1111-1111-1111-111111111111
              lider_id: 44444444-4444-4444-4444-444444444444
      '400':
        description: |
          Se eligió a sí mismo (`INVALID_LEADER`) o el body es inválido (`VALIDATION_ERROR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No podés cederte el liderazgo a vos mismo
              code: INVALID_LEADER
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Solo el líder actual puede ceder el liderazgo (`NOT_CREATOR`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo el líder puede ceder el liderazgo
              code: NOT_CREATOR
      '404':
        description: |
          El viaje no existe (`VIAJE_NOT_FOUND`) o el sucesor no es integrante
          confirmado (`MEMBER_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El nuevo líder no es integrante confirmado del viaje
              code: MEMBER_NOT_FOUND
      '409':
        description: |
          Viaje individual (`INDIVIDUAL_TRIP`), ya finalizado (`INVALID_STATE`) o el
          sucesor todavía no se sumó al viaje en curso (`NOT_CHECKED_IN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              finalizado:
                value:
                  error: El viaje ya finalizó
                  code: INVALID_STATE
              sinCheckIn:
                value:
                  error: El nuevo líder todavía no se sumó al viaje
                  code: NOT_CHECKED_IN
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

OcultarViaje:
  post:
    operationId: ocultarViaje
    summary: Quitar un viaje finalizado del historial propio
    description: |
      "Borrar para mí": el viaje deja de aparecer en `GET /api/viajes/finalizados`
      de quien lo pide. El viaje, su resumen y las métricas siguen intactos para el
      resto del grupo.

      Restricciones:

      - El creador no oculta, elimina el viaje (`CREATOR_MUST_DELETE`).
      - Solo viajes `finalizado` (`INVALID_STATE`).
      - Hay que haber participado: integrante `confirmado` o `salido` (`NOT_PARTICIPANT`).
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: El viaje se quitó del historial del usuario.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ViajeOcultado'
            example:
              viaje_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              accion: ocultado
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: |
          Quien pide es el creador (`CREATOR_MUST_DELETE`) o no participó del viaje
          (`NOT_PARTICIPANT`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              creador:
                value:
                  error: El creador elimina el viaje, no lo oculta
                  code: CREATOR_MUST_DELETE
              noParticipo:
                value:
                  error: No participaste de este viaje
                  code: NOT_PARTICIPANT
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: El viaje no está finalizado (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Solo se puede quitar del historial un viaje finalizado
              code: INVALID_STATE
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

LeaderboardViaje:
  get:
    operationId: obtenerLeaderboard
    summary: Leaderboard en vivo del modo competitivo (RN-071)
    description: |
      Foto actual de la clasificación: integrantes ordenados por progreso sobre la
      ruta planificada, con la diferencia con el líder en metros y en segundos (a la
      velocidad esperada del viaje). Sirve para cargar la tabla al entrar; después el
      motor de eventos la re-emite por Socket.io (`viaje:leaderboard`) con cada ping,
      como máximo cada 3 s por viaje. Solo con `modo: competitivo`, viaje en curso y
      nunca en moto ni auto (RN-070).
    tags:
      - Viajes
    parameters:
      - $ref: '../components/parameters.yaml#/ViajeId'
    responses:
      '200':
        description: Clasificación actual.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Leaderboard'
            example:
              viaje_id: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
              generado_en: '2026-09-01T13:20:00.000Z'
              filas:
                - usuarioId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                  nombre: Ana Pérez
                  progresoM: 5420
                  lat: -31.41
                  lng: -64.18
                  actualizadoEn: '2026-09-01T13:19:58.000Z'
                  puesto: 1
                  deltaM: 0
                  gapSeg: 0
                - usuarioId: 7e8f90a1-bc2d-4e3f-8a4b-5c6d7e8f90a1
                  nombre: Juan Gómez
                  progresoM: 5100
                  lat: -31.412
                  lng: -64.183
                  actualizadoEn: '2026-09-01T13:19:57.000Z'
                  puesto: 2
                  deltaM: 320
                  gapSeg: 32.9
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: No es creador ni integrante confirmado (`FORBIDDEN`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Sin acceso a este viaje
              code: FORBIDDEN
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: No es competitivo o es moto/auto (`MODO_INVALIDO`), o no está en curso (`INVALID_STATE`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: El viaje no está en modo competitivo
              code: MODO_INVALIDO
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
