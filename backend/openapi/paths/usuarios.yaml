# Módulo Usuarios — src/modules/usuarios/
# Router: usuarios.router.ts · Controller: usuarios.controller.ts

UsuarioActual:
  get:
    operationId: getMe
    summary: Obtener el perfil propio
    description: |
      Devuelve el perfil del usuario autenticado, resuelto a partir del Firebase ID token.

      Si el token es válido pero todavía no existe un `Usuario` local, `requireUser` lo
      crea automáticamente (`findOrCreateByFirebaseUid`), así que en la práctica el 404
      solo aparece si el registro se eliminó entre la verificación del token y la consulta.
    tags:
      - Usuarios
    responses:
      '200':
        description: Perfil del usuario autenticado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Usuario'
            example:
              id: 8f14e45f-ceea-4c1e-9b1a-3d5c7a2e6b04
              email: martina@example.com
              nombre: Martina
              apellido: Gómez
              telefono: '+54 351 555 1234'
              actividad_preferida: bici
              rol_sistema: usuario
              foto_perfil: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

SincronizarUsuario:
  post:
    operationId: syncUsuario
    summary: Sincronizar el perfil con los datos de la app
    description: |
      Persiste los datos de perfil tras el login con Firebase.

      **Requiere autenticación.** El usuario a actualizar no se toma del body sino del
      token: siempre es el propio. El `email` del body se ignora, porque el email es el
      de Firebase y es único por usuario (RN-001).

      Semántica de campos opcionales: si el campo no viene, el valor actual queda intacto;
      si viene en `null`, se limpia.
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/SyncUsuarioRequest'
          example:
            email: martina@example.com
            nombre: Martina
            apellido: Gómez
            telefono: '+54 351 555 1234'
            actividad_preferida: bici
    responses:
      '200':
        description: Perfil actualizado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Usuario'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

PushToken:
  put:
    operationId: upsertPushToken
    summary: Registrar el token de notificaciones push
    description: |
      Guarda el token de Expo Push del dispositivo actual para poder enviarle
      notificaciones (invitaciones a viajes y grupos, alertas del viaje).

      Cada usuario guarda un único token: registrar uno nuevo reemplaza al anterior.
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PushTokenRequest'
    responses:
      '200':
        description: Token registrado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/OperacionOk'
            example:
              ok: true
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

PerfilPublicoUsuario:
  get:
    operationId: obtenerPerfilPublico
    summary: Ver el perfil de un usuario de la comunidad
    description: |
      Perfil de cualquier usuario autenticado. Siempre incluye nombre,
      actividad preferida y, si no es el propio usuario, la relación de
      amistad con quien consulta (para poder mandar la solicitud).

      Los logros —estadísticas agregadas (equivalente genérico de
      `GET /viajes/estadisticas`, sin velocidad por RN-070), insignias con su
      rareza (RN-074/RN-078) y racha (RN-075)— se incluyen solo si la persona
      los comparte con quien consulta (RN-077). Si no, `logros_visibles` es
      `false` y esos tres campos vuelven en `null`: no es un error, el perfil
      se muestra igual.
    tags:
      - Usuarios
    parameters:
      - $ref: '../components/parameters.yaml#/UsuarioId'
    responses:
      '200':
        description: Perfil público del usuario.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PerfilPublico'
            example:
              id: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d
              nombre: Martina
              apellido: Gómez
              actividad_preferida: bici
              foto_perfil: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/public/avatares/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg
              es_yo: false
              relacion_amistad: amigo
              visibilidad_logros: amigos
              logros_visibles: true
              racha:
                semanas_consecutivas: 4
                en_riesgo: false
              estadisticas:
                viajes_finalizados: 12
                distancia_total_m: 745300.2
                tiempo_total_seg: 86400
                actividad_favorita: bici
              insignias:
                - id: 6d7e8f90-ab1c-4d2e-9f3a-4b5c6d7e8f90
                  insignia_id: a1000000-0000-4000-8000-000000000003
                  codigo: diez_k_running
                  nombre: 10K
                  descripcion: Corriste 10 km o más en un mismo viaje.
                  icono: zap
                  rareza: rara
                  viaje_id: 3f2c9a10-8b5e-4a71-9c3d-1e2f4a5b6c7d
                  obtenida_at: '2026-10-20T12:00:00.000Z'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: Usuario no encontrado (`USER_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Usuario no encontrado
              code: USER_NOT_FOUND
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

SubidaFotoPerfil:
  post:
    operationId: crearSubidaFotoPerfil
    summary: Preparar la subida de la foto de perfil
    description: |
      Paso 1 de 3. El backend elige la ruta dentro de la carpeta del usuario y
      devuelve una URL firmada de Supabase Storage para subir ahí un JPEG.
      Los bytes van directo del dispositivo a Storage, sin pasar por el servidor.

      Paso 2: `PUT {upload_url}` con el JPEG (`Content-Type: image/jpeg`, hasta 2 MB).
      Paso 3: `PUT /api/usuarios/me/foto` con el `path` para confirmarla.
    tags:
      - Usuarios
    responses:
      '200':
        description: URL firmada lista para subir.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SubidaFotoPerfil'
            example:
              path: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg
              upload_url: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/upload/sign/avatares/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg?token=eyJhbGciOi
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '502':
        description: Supabase Storage no respondió (`FOTO_SUBIDA_FALLIDA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se pudo preparar la subida de la foto
              code: FOTO_SUBIDA_FALLIDA
      '503':
        description: Storage no está configurado en este entorno (`FOTOS_NO_DISPONIBLES`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Las fotos de perfil no están disponibles
              code: FOTOS_NO_DISPONIBLES
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

FotoPerfil:
  put:
    operationId: confirmarFotoPerfil
    summary: Confirmar la foto de perfil subida
    description: |
      Paso 3 de 3. Verifica que el archivo exista en la carpeta del propio
      usuario y que sea un JPEG de hasta 2 MB (RN-030: el backend valida, no la
      app). Si es válido lo guarda como foto de perfil y borra la anterior y
      cualquier subida que nunca se confirmó. Si no, lo borra y responde 400.
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ConfirmarFotoPerfilRequest'
          example:
            path: 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg
    responses:
      '200':
        description: Foto guardada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FotoPerfilResponse'
            example:
              foto_perfil: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/public/avatares/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg
      '400':
        description: Ruta ajena o inválida (`FOTO_PATH_INVALIDO`), archivo no subido (`FOTO_NO_SUBIDA`) o que no es un JPEG de hasta 2 MB (`FOTO_INVALIDA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: La foto tiene que ser un JPEG de hasta 2 MB
              code: FOTO_INVALIDA
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '502':
        description: Supabase Storage no respondió (`FOTO_SUBIDA_FALLIDA`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: No se pudo verificar la foto
              code: FOTO_SUBIDA_FALLIDA
      '503':
        description: Storage no está configurado en este entorno (`FOTOS_NO_DISPONIBLES`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Las fotos de perfil no están disponibles
              code: FOTOS_NO_DISPONIBLES
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

  delete:
    operationId: eliminarFotoPerfil
    summary: Quitar la foto de perfil
    description: Vuelve a las iniciales y borra el archivo de Storage.
    tags:
      - Usuarios
    responses:
      '200':
        description: Foto quitada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FotoPerfilResponse'
            example:
              foto_perfil: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: Usuario no encontrado (`USER_NOT_FOUND`).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Usuario no encontrado
              code: USER_NOT_FOUND
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

FotosUsuarios:
  post:
    operationId: consultarFotosUsuarios
    summary: Fotos de perfil de varios usuarios
    description: |
      Devuelve en una sola llamada las fotos de hasta 200 usuarios: la app junta
      los avatares de una pantalla y los pide juntos. Es `POST` para no armar una
      URL con 200 UUID. Solo devuelve la URL pública de la foto, ningún otro dato.
    tags:
      - Usuarios
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ConsultarFotosRequest'
          example:
            ids:
              - 9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d
              - 2c9a7d61-4e83-4b2f-9a17-6d0e5b8c1f23
    responses:
      '200':
        description: Fotos encontradas.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ConsultarFotosResponse'
            example:
              fotos:
                9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d: https://ddmnzklvxbijpcpckwez.supabase.co/storage/v1/object/public/avatares/9d8c7b6a-5e4f-4a3b-9c2d-1e0f9a8b7c6d/1792000000000.jpg
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
